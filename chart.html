<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇門遁甲 - 拆補法排盤 (v22)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
        /* 基礎古典優雅主題 */
        body { 
            font-family: 'BiauKai', 'DFKai-SB', 'Kaiti', 'STKaiti', 'Noto Serif TC', serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            min-height: 100vh;
            font-weight: bold;
            color: #1a202c;
            transition: all 0.5s ease;
        }
        .main-container {
            transition: all 0.5s ease;
        }
        .grid-wrapper { padding: 30px 28px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        @media (max-width: 640px) {
            .grid-wrapper { padding: 20px 25px; }
            .grid-qimen { gap: 6px !important; margin: 0 auto; width: calc(100% - 10px); }
            .palace { min-height: 150px !important; padding: 6px !important; }
            .branch-label { font-size: 0.8rem !important; }
        }
        .grid-qimen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 550px; min-width: 300px; margin: auto; }
        
        /* 宮位基礎樣式 */
        .palace { 
            position: relative; border-radius: 10px; padding: 8px; min-height: 200px; 
            display: flex; flex-direction: column; box-shadow: 0 3px 10px rgba(0,0,0,0.08); 
            border: 1.5px solid; background-color: rgba(255, 255, 255, 0.85); 
            transition: all 0.3s ease; cursor: pointer;
        }
        .palace-active { border: 4px solid #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); z-index: 30; }

        /* 古典五行配色 */
        .bg-water { background-color: #f0f9ff; border-color: #bae6fd; } .text-water { color: #0369a1; }
        .bg-brown { background-color: #fcf6f0; border-color: #d7c4b4; } .text-brown { color: #78350f; }
        .bg-wood { background-color: #f0fdf4; border-color: #bbf7d0; } .text-wood { color: #15803d; }
        .bg-fire { background-color: #fef2f2; border-color: #fecaca; } .text-fire { color: #b91c1c; }
        .bg-metal { background-color: #fffbeb; border-color: #fde68a; } .text-metal { color: #b45309; }
        .bg-white-palace { background-color: #ffffff; border-color: #e2e8f0; } 
        
        .text-main { font-size: clamp(0.95rem, 2.5vw, 1.45rem); line-height: 1.1; }
        .text-palace-name { font-weight: 900; }
        
        .day-stem { display: inline-block; background-color: #f3e8ff; border: 1.5px solid #a855f7; padding: 0 3px; border-radius: 4px; line-height: 1.1; }
        .hour-stem { display: inline-block; background-color: #ffedd5; border: 1.5px solid #f97316; padding: 0 3px; border-radius: 4px; line-height: 1.1; }
        
        .emoji-container { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 1.3rem; line-height: 1; z-index: 10; }
        .branch-label { position: absolute; color: #4b5563; font-size: 0.9rem; pointer-events: none; opacity: 0.9; z-index: 10; }

        /* ==========================================
           🌌 賽博玄學 (Cyber-Fengshui) 暗黑主題樣式
           ========================================== */
        .theme-cyber {
            background: radial-gradient(circle at center, #070710 0%, #020205 100%) !important;
            color: #cbd5e1 !important;
        }

        /* 賽博卡片 */
        .theme-cyber .main-container {
            background-color: rgba(11, 11, 24, 0.9) !important;
            border-color: rgba(226, 232, 240, 0.15) !important;
            box-shadow: 0 0 30px rgba(0, 82, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.02) !important;
        }

        /* 賽博標題 */
        .theme-cyber h1 {
            color: #e2e8f0 !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3), 0 0 3px rgba(255, 255, 255, 0.5) !important;
            letter-spacing: 0.25em;
        }
        .theme-cyber .title-link {
            color: #a78bfa !important;
        }
        .theme-cyber .title-link:hover {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.8) !important;
        }

        /* 控制列與資訊面板 */
        .theme-cyber select, .theme-cyber input[type="text"] {
            background-color: #0f0f20 !important;
            border-color: #2a2a4e !important;
            color: #f1f5f9 !important;
        }
        .theme-cyber .bg-indigo-50\/50 {
            background-color: rgba(15, 15, 32, 0.7) !important;
            border-color: rgba(167, 139, 250, 0.15) !important;
        }
        .theme-cyber #pan-header {
            background-color: rgba(12, 12, 28, 0.95) !important;
            border-left-color: #a855f7 !important;
            border-color: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.08) !important;
            color: #cbd5e1 !important;
        }
        .theme-cyber #pan-header span.text-indigo-900,
        .theme-cyber #pan-header span.text-indigo-800 {
            color: #c084fc !important;
            text-shadow: 0 0 5px rgba(192, 132, 252, 0.3) !important;
        }

        /* 賽博宮位基本卡片 */
        .theme-cyber .palace {
            background-color: rgba(7, 7, 18, 0.9) !important;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.01), 0 4px 15px rgba(0, 0, 0, 0.7) !important;
            border-width: 1.5px !important;
        }

        /* ==========================================
           🌌 賽博五行電學配色 (配合傳統五行概念)
           ========================================== */
        
        /* 水 (坎一) - 電光深藍 */
        .theme-cyber .bg-water { 
            border-color: #0052ff !important; 
            box-shadow: 0 0 15px rgba(0, 82, 255, 0.35), inset 0 0 8px rgba(0, 82, 255, 0.15) !important; 
        } 
        .theme-cyber .text-water { 
            color: #38bdf8 !important; 
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.7) !important; 
        }
        
        /* 木 (震三/巽四) - 量子熒光綠 */
        .theme-cyber .bg-wood { 
            border-color: #00e676 !important; 
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.35), inset 0 0 8px rgba(0, 230, 118, 0.15) !important; 
        } 
        .theme-cyber .text-wood { 
            color: #69f0ae !important; 
            text-shadow: 0 0 8px rgba(105, 240, 174, 0.7) !important; 
        }

        /* 火 (離九) - 脈衝熱核紅 */
        .theme-cyber .bg-fire { 
            border-color: #ff1744 !important; 
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.35), inset 0 0 8px rgba(255, 23, 68, 0.15) !important; 
        } 
        .theme-cyber .text-fire { 
            color: #ff5252 !important; 
            text-shadow: 0 0 8px rgba(255, 82, 82, 0.7) !important; 
        }

        /* 土 (坤二/艮八) - 賽博土黃/暖琥珀 */
        .theme-cyber .bg-brown { 
            border-color: #5B2F1A !important; 
            box-shadow: 0 0 18px rgba(251, 146, 60, 0.45), inset 0 0 8px rgba(251, 146, 60, 0.2) !important; 
        } 
        .theme-cyber .text-brown { 
            color: #5B2F1A !important; 
            text-shadow: 0 0 8px rgba(180, 83, 9, 0.3) !important; 
        }

        /* 金 (乾六/兌七) - 鈦極亮銀白 */
        .theme-cyber .bg-metal { 
            border-color: #fb923c !important; 
            box-shadow: 0 0 18px rgba(251, 146, 60, 0.45), inset 0 0 8px rgba(251, 146, 60, 0.2) !important; 
        } 
        .theme-cyber .text-metal { 
            color: #fb923c !important; 
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4) !important; 
        }

        /* 中五宮 (中性鈦灰) */
        .theme-cyber .bg-white-palace {
            background-color: #0c0c1b !important;
            border-color: #475569 !important;
            box-shadow: 0 0 10px rgba(71, 85, 105, 0.2) !important;
        }

        /* ========================================== */

        /* 量子活躍落宮 (極致呼吸霓虹燈) */
        .theme-cyber .palace-active { 
            border: 3px solid #00f5ff !important; 
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.8), inset 0 0 10px rgba(0, 245, 255, 0.3) !important; 
            z-index: 30;
            animation: cyber-pulse 2s infinite alternate;
        }
        @keyframes cyber-pulse {
            0% { box-shadow: 0 0 12px rgba(0, 245, 255, 0.35), inset 0 0 5px rgba(0, 245, 255, 0.15); }
            100% { box-shadow: 0 0 28px rgba(0, 245, 255, 0.85), inset 0 0 12px rgba(0, 245, 255, 0.35); }
        }

        /* 賽博天干高亮 */
        .theme-cyber .day-stem { 
            background-color: rgba(168, 85, 247, 0.15) !important; 
            border-color: #a855f7 !important; 
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.5) !important;
            color: #e9d5ff !important;
        }
        .theme-cyber .hour-stem { 
            background-color: rgba(249, 115, 22, 0.15) !important; 
            border-color: #f97316 !important; 
            box-shadow: 0 0 8px rgba(249, 115, 22, 0.5) !important;
            color: #ffedd5 !important;
        }

        /* 賽博按鈕 */
        .theme-cyber button {
            transition: all 0.3s ease;
        }
        .theme-cyber button:hover {
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4) !important;
            transform: scale(1.02);
        }

        /* 賽博地支標籤 */
        .theme-cyber .branch-label {
            color: #64748b !important;
            opacity: 0.7;
        }

        /* 彈窗深色賽博化 */
        .theme-cyber #palace-modal > div,
        .theme-cyber #jieqi-modal > div {
            background-color: #080815 !important;
            border-color: #38bdf8 !important;
            color: #cbd5e1 !important;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25) !important;
        }
        .theme-cyber #palace-modal h3,
        .theme-cyber #palace-modal h4 {
            color: #38bdf8 !important;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3) !important;
        }
        .theme-cyber #palace-modal .bg-indigo-50\/80 {
            background-color: #0f0f24 !important;
            border-color: #1e1b4b !important;
        }
        .theme-cyber #pm-geju > div {
            background-color: #0e0e20 !important;
            border-color: #1d1d3b !important;
        }

        /* 賽博特殊狀態欄字樣發光 */
        .theme-cyber #info-special span.text-red-700 {
            color: #ff5252 !important;
            text-shadow: 0 0 6px rgba(255, 82, 82, 0.5) !important;
        }
        .theme-cyber #info-special span.text-amber-700 {
            color: #fbbf24 !important;
            text-shadow: 0 0 6px rgba(251, 191, 36, 0.5) !important;
        }
        .theme-cyber #info-special span.text-purple-700 {
            color: #c084fc !important;
            text-shadow: 0 0 6px rgba(192, 132, 252, 0.5) !important;
        }
        .theme-cyber #info-special span.text-blue-700 {
            color: #60a5fa !important;
            text-shadow: 0 0 6px rgba(96, 165, 250, 0.5) !important;
        }
    </style>
</head>
<body class="p-2 md:p-8">

<div class="max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-4 md:p-8 border border-white main-container">
    <h1 class="text-2xl md:text-4xl text-center mb-6 text-indigo-900 tracking-widest">
        奇門遁甲 - 拆補法排盤(<a href="https://hrauto2026.github.io/qimen-app/index.html" class="title-link hover:text-indigo-600 transition-colors duration-300">返回主頁</a>)
    </h1>
    
    <div class="flex flex-wrap justify-center items-center gap-2 mb-4 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 shadow-inner">
        <div class="flex items-center gap-1">
            <select id="sel-year" class="p-1 border border-gray-300 rounded bg-white text-base outline-none" onchange="updateJieQiYearBtn()"></select>
            <span class="text-gray-600 text-sm">年</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-month" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">月</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-day" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">日</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-hour24" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">時</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-minute" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">分</span>
        </div>
        <div class="w-full sm:w-auto flex justify-center gap-2 mt-2 sm:mt-0">
            <button onclick="resetToNow()" class="bg-blue-500 hover:bg-blue-600 text-white py-1.5 px-3 rounded-lg shadow text-sm">現在時間</button>
            <button onclick="generatePan()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 px-5 rounded-lg shadow text-sm">起盤</button>
            <button onclick="showJieQiModal()" class="bg-teal-600 hover:bg-teal-700 text-white py-1.5 px-3 rounded-lg shadow text-xs">🗓️ <span id="btn-jieqi-year"></span>年廿四節氣</button>
        </div>
    </div>

    <div id="pan-header" class="hidden mb-4 p-4 border-l-4 border-indigo-500 bg-indigo-50/80 rounded-r-lg text-gray-800 shadow-sm">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-2 gap-2">
            <h2 class="text-base sm:text-lg md:text-xl text-indigo-900 font-bold" id="info-bazi"></h2>
            <div class="flex space-x-2">
                <button onclick="shiftHour(-1)" class="flex-1 sm:flex-none bg-white border border-indigo-200 text-indigo-700 py-1.5 px-4 rounded shadow-sm text-xs sm:text-sm font-bold">◀ 前一時辰</button>
                <button onclick="shiftHour(1)" class="flex-1 sm:flex-none bg-white border border-indigo-200 text-indigo-700 py-1.5 px-4 rounded shadow-sm text-xs sm:text-sm font-bold">後一時辰 ▶</button>
            </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1 sm:gap-2 text-sm sm:text-base md:text-lg leading-tight">
            <div><span class="text-gray-500">節氣：</span><span id="info-jieqi" class="text-indigo-800 font-bold"></span></div>
            <div><span class="text-gray-500">局數：</span><span id="info-ju" class="text-red-600 font-bold"></span></div>
            <div><span class="text-gray-500">旬首：</span><span id="info-xunshou"></span></div>
            <div><span class="text-gray-500">值符：</span><span id="info-zhifu"></span></div>
            <div><span class="text-gray-500">值使：</span><span id="info-zhishi"></span></div>
            <div><span class="text-gray-500">空亡：</span><span id="info-kongwang"></span></div>
        </div>
        <div id="info-special" class="hidden text-sm sm:text-base md:text-lg mt-1 border-t border-indigo-200 pt-1 font-bold"></div>
    </div>

    <div class="grid-wrapper">
        <div id="qimen-grid" class="grid-qimen hidden">
            <div id="palace-4" class="palace bg-wood" onclick="highlightPalace(this)"></div>
            <div id="palace-9" class="palace bg-fire" onclick="highlightPalace(this)"></div>
            <div id="palace-2" class="palace bg-brown" onclick="highlightPalace(this)"></div>
            <div id="palace-3" class="palace bg-wood" onclick="highlightPalace(this)"></div>
            <div id="palace-5" class="palace bg-white-palace" onclick="highlightPalace(this)"></div>
            <div id="palace-7" class="palace bg-metal" onclick="highlightPalace(this)"></div>
            <div id="palace-8" class="palace bg-brown" onclick="highlightPalace(this)"></div>
            <div id="palace-1" class="palace bg-water" onclick="highlightPalace(this)"></div>
            <div id="palace-6" class="palace bg-metal" onclick="highlightPalace(this)"></div>
        </div>
    </div>

    <div class="flex justify-center items-center mt-6 hidden gap-4 flex-wrap" id="action-footer">
        <button onclick="copyPan()" class="bg-slate-800 hover:bg-black text-white py-2.5 px-6 rounded-full shadow-lg transition active:scale-95 flex items-center justify-center text-base">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            複製盤面資料
        </button>
        <button onclick="sharePan()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-6 rounded-full shadow-lg transition active:scale-95 flex items-center justify-center text-base">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            分享起盤連結
        </button>
        
        <div class="flex items-center gap-2 bg-purple-950/20 px-4 py-2 rounded-full shadow border border-purple-500/30">
            <span class="text-sm font-bold text-purple-700" id="cyber-label">晚間模式</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-cyber" class="sr-only peer" onchange="toggleCyberTheme()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed shadow-inner"></div>
            </label>
        </div>

        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow border border-indigo-100">
            <span class="text-sm font-bold text-gray-700" id="bagua-label">先天八卦數</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-bagua" class="sr-only peer" onchange="toggleBaGua()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed shadow-inner"></div>
            </label>
        </div>
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow border border-orange-100">
            <span class="text-sm font-bold text-gray-700" id="energy-label">能量狀態</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-energy" class="sr-only peer" onchange="toggleEnergy()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed shadow-inner"></div>
            </label>
        </div>
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow border border-green-100">
            <span class="text-sm font-bold text-gray-700">內外盤</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-neiwai" class="sr-only peer" onchange="toggleNeiWai()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed shadow-inner"></div>
            </label>
        </div>
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow border border-blue-100">
            <span class="text-sm font-bold text-gray-700">按宮看格局</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-palacemodal" class="sr-only peer" onchange="togglePalaceModal()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500 peer-disabled:opacity-50 peer-disabled:cursor-not-allowed shadow-inner"></div>
            </label>
        </div>
    </div>
</div>

<div id="jieqi-modal" class="fixed inset-0 bg-gray-900/60 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-5 max-w-md w-full max-h-[80vh] overflow-y-auto relative border-t-8 border-teal-600">
        <button onclick="closeJieQiModal()" class="absolute top-3 right-4 text-gray-400 hover:text-black text-2xl">✖</button>
        <h3 class="text-xl mb-4 text-center text-teal-800" id="jieqi-modal-title"></h3>
        <div id="jieqi-modal-content" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm"></div>

    function calculateGeju(data) {
        let results = [];
        if(!data.hStems || !data.eStems) return results;

        let hasH = (s) => data.hStems.includes(s);
        let hasE = (s) => data.eStems.includes(s);
        let hasA = (s) => hasH(s) || hasE(s); 
        
        let door = data.door.replace('門', '');
        let god = data.god;
        let pNum = data.palaceNum;
        let isJiMen = ['開', '休', '生'].includes(door);
        let isSanQi = (s) => ['乙', '丙', '丁'].includes(s);

        for (let th of data.hStems) {
            for (let te of data.eStems) {
                let key = `${th}+${te}`;
                if (GEJU_MAP[key]) {
                    results.push({
                        name: GEJU_MAP[key].name,
                        type: GEJU_MAP[key].type,
                        desc: GEJU_MAP[key].desc
                    });
                }
                
                if (!GEJU_MAP[key] && ((th==='乙'&&te==='庚') || (th==='丙'&&te==='辛') || (th==='丁'&&te==='壬') || (th==='戊'&&te==='癸') || (th==='甲'&&te==='己'))) {
                    results.push({ name: '奇儀相合', type: '吉', desc: '和合之象，利合作、謀事、婚姻。' });
                }
            }
        }

        if (pNum === 3 && hasA('乙')) {
            results.push({ name: '三奇升殿 / 奇游祿位 (乙)', type: '大吉', desc: '乙奇臨震宮。主有貴人提攜，求財吉利，官職高陞，百事大吉。' });
        }
        if (pNum === 9 && hasA('丙')) {
            results.push({ name: '三奇升殿 (丙)', type: '大吉', desc: '丙奇臨離宮。主有貴人提攜，利見大人，百事大吉。' });
        }
        if (pNum === 7 && hasA('丁')) {
            results.push({ name: '三奇升殿 (丁)', type: '大吉', desc: '丁奇臨兌宮。主有貴人提攜，利見大人，百事大吉。' });
        }
        if (pNum === 4 && hasA('丙')) {
            results.push({ name: '奇游祿位 (丙)', type: '大吉', desc: '丙奇臨巽宮祿位。求財吉利，官職高陞。' });
        }
        if (pNum === 9 && hasA('丁')) {
            results.push({ name: '奇游祿位 (丁)', type: '大吉', desc: '丁奇臨離宮祿位。求財吉利，官職高陞。' });
        }

        if (isJiMen && hasH('丙') && (hasE('丁') || god === '九地' || god === '太陰')) {
            results.push({ name: '天遁', type: '吉', desc: '《奇門遁甲秘笈大全》：『開休生三吉門，天盤丙奇下臨地盤丁奇者，皆名「天遁」，得月精所蔽。或臨地盤九地、太陰者，亦名「天遁」，可以遁跡、隱形。』' });
        }
        if (isJiMen && hasH('乙') && (god === '六合' || god === '九地' || god === '太陰')) {
            results.push({ name: '地遁', type: '吉', desc: '《奇門遁甲秘笈大全》：『開休生合乙奇，下臨地盤六合、九地、太陰宮者，皆名「地遁」，宜修築、起造、埋葬之事。』' });
        }
        if ((isJiMen && hHasQi && god === '六合') || (door === '生' && hHasQi && god === '太陰') || (door === '生' && hasH('乙') && god === '九地')) {
            results.push({ name: '人遁', type: '吉', desc: '《奇門遁甲秘笈大全》：『開休生合三奇，下臨地盤六合者，名為「人遁」。』' });
        }
        if ((door === '開' && hasH('乙') && (data.star.includes('心') || data.star.includes('禽')) && god === '九天' && pNum === 6) || (door === '生' && hasH('丙') && (data.star.includes('心') || data.star.includes('禽')) && god === '九天')) {
            results.push({ name: '神遁', type: '吉', desc: '《奇門遁甲秘笈大全》：『開門、乙奇合天心星或天禽星，下臨地盤九天於乾宮，名為「神遁」。此方宜驅神遣將。』' });
        }
        if ((door === '休' && data.star.includes('輔') && hasH('辛') && hasE('丁') && pNum === 8) || (door === '生' && god === '太陰' && hasE('丁')) || (door === '生' && god === '九地' && hasE('丁'))) {

        }

    function getAccurateJieQi(currentDate) {
        let jieQiName = "未知", timeStr = "";
        try {
            const solar = Solar.fromDate(currentDate);
            const lunar = solar.getLunar();
            
            let prevJ = lunar.getPrevJie(true);
            let prevQ = lunar.getPrevQi(true);

            let dJ = new Date(prevJ.getSolar().getYear(), prevJ.getSolar().getMonth() - 1, prevJ.getSolar().getDay(), prevJ.getSolar().getHour(), prevJ.getSolar().getMinute(), prevJ.getSolar().getSecond());
            let dQ = new Date(prevQ.getSolar().getYear(), prevQ.getSolar().getMonth() - 1, prevQ.getSolar().getDay(), prevQ.getSolar().getHour(), prevQ.getSolar().getMinute(), prevQ.getSolar().getSecond());

            if (dJ > currentDate) {
                prevJ = lunar.getPrevJie(false);
                dJ = new Date(prevJ.getSolar().getYear(), prevJ.getSolar().getMonth() - 1, prevJ.getSolar().getDay(), prevJ.getSolar().getHour(), prevJ.getSolar().getMinute(), prevJ.getSolar().getSecond());
            }
            
            if (dQ > currentDate) {
                prevQ = lunar.getPrevQi(false);
                dQ = new Date(prevQ.getSolar().getYear(), prevQ.getSolar().getMonth() - 1, prevQ.getSolar().getDay(), prevQ.getSolar().getHour(), prevQ.getSolar().getMinute(), prevQ.getSolar().getSecond());
            }

            let targetJQ;
            if (dJ > dQ) {
                targetJQ = prevJ;
            } else {
                targetJQ = prevQ;
            }

            jieQiName = TRAD_JIEQI[targetJQ.getName()] || targetJQ.getName();
            timeStr = targetJQ.getSolar().toYmdHms();
        } catch (e) { console.error(e); }
        return { name: jieQiName, time: timeStr };
    }

            // 反吟判定
            if (isMenFanyin) { fuyinHTML += "<span class='text-red-700 mr-2'>【門反吟】</span>"; rawFuyin += "【門反吟】"; }
            if (isStarFanyin) { fuyinHTML += "<span class='text-amber-700 mr-2'>【星反吟】</span>"; rawFuyin += "【星反吟】"; }
            if (isGanFanyin) { fuyinHTML += "<span class='text-purple-700 mr-2'>【干反吟】</span>"; rawFuyin += "【干反吟】"; }

            let dPalaces = [];
            for(let i=1; i<=9; i++) {
                if(i===5) continue;
                let hStems = Array.isArray(heavenPan[i]) ? heavenPan[i] : [heavenPan[i]];
                if(hStems.includes(dayHighlightStem)) dPalaces.push(i); 
            }
            let monthBranch = monthGZ.substring(1, 2);
            let clashBranch = CLASH_MAP[monthBranch];
            let isZuo = false;
            let isChong = false;
            for(let p of dPalaces) {
                let pBranches = PALACES_HOU[p].branch; 
                if(pBranches.includes(monthBranch)) isZuo = true;
                if(pBranches.includes(clashBranch)) isChong = true;
            }
            
            let stemStatusStr = "", rawStemStatus = "";
            if (isZuo) { stemStatusStr = "<span class='text-blue-700'>【日干落月令之宮】</span>"; rawStemStatus = "【日干落月令之宮】"; }
            if (isChong) { stemStatusStr = "<span class='text-red-700'>【月令沖日干】</span>"; rawStemStatus = "【月令沖日干】"; }

            // 整合特殊狀態
            let combinedStatusHTML = fuyinHTML + stemStatusStr;
            let combinedRawStatus = rawFuyin + rawStemStatus;

            if (!combinedStatusHTML) {
                document.getElementById('info-special').classList.add('hidden');
                document.getElementById('info-special').innerHTML = "";
            } else {
                document.getElementById('info-special').classList.remove('hidden');
                document.getElementById('info-special').innerHTML = combinedStatusHTML;
            }

            document.getElementById('pan-header').classList.remove('hidden');
            document.getElementById('qimen-grid').classList.remove('hidden');
            document.getElementById('action-footer').classList.remove('hidden');
            document.getElementById('action-footer').classList.add('flex');

            const isMenPo = (door, pNum) => {
                const fire = pNum===9, water = pNum===1, earth = pNum===2||pNum===8, metal = pNum===6||pNum===7, wood = pNum===3||pNum===4;
                if (door==="休門" && fire) return true; if ((door==="生門"||door==="死門") && water) return true; if ((door==="傷門"||door==="杜門") && earth) return true; if (door==="景門" && metal) return true; if ((door==="驚門"||door==="開門") && wood) return true; return false;
            };

            const isJiXing = (stem, pNum) => {
                if (stem === '戊' && pNum === 3) return true; 
                if (stem === '己' && pNum === 2) return true; 
                if (stem === '庚' && pNum === 8) return true; 
                if (stem === '辛' && pNum === 9) return true; 
                if (['壬', '癸'].includes(stem) && pNum === 4) return true; 
                return false;
            };

            const isRuMu = (stem, pNum) => {
                if (['乙', '丙', '戊'].includes(stem) && pNum === 6) return true; 
                if (['丁', '己', '庚'].includes(stem) && pNum === 8) return true; 
                if (['辛', '壬'].includes(stem) && pNum === 4) return true; 
                if (stem === '癸' && pNum === 2) return true; 
                return false;
            };

            const getStemTagsText = (stem, pNum) => {
                let tags = [];
                if(isJiXing(stem, pNum)) tags.push("刑");
                if(isRuMu(stem, pNum)) tags.push("墓");
                return tags.length ? `(${tags.join("+")})` : "";
            };

            let copyBaziLine = `${baziRawStr} (${y}年${m}月${d}日 ${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}${ziMark ? ' ' + ziMark : ''})`;
            panData = { bazi: copyBaziLine, ju: juStr, xun: xunShouGZ+xunShouStem, zf: zhiFuStar, zs: doorPan[currentD_val], kw: kw1+"、"+kw2, special: rawSpecialInfo, stemStatus: combinedRawStatus, palaces: {} };
            const currentMonthBranch = monthGZ.substring(1, 2);
            const getBranchHTML = (i) => {
                let text = BRANCH_POSITIONS_TEMPLATE[i], html = "";
                for(let b of text) {
                    let wColor = WUXING_COLORS[b], style = `color: ${wColor}; font-weight: bold;`;
                    if(b === currentMonthBranch) html += `<div class="branch-label palace-${i}-${b} bg-yellow-200 px-1 rounded shadow border border-yellow-400 font-extrabold" style="${style}">${b}</div>`;
                    else html += `<div class="branch-label palace-${i}-${b}" style="${style}">${b}</div>`;
                }
                if(i===1) return html.replace('label palace-1-子', 'label -bottom-6 left-1/2 -translate-x-1/2');
                if(i===8) return html.replace('label palace-8-丑', 'label -bottom-5 left-1/4').replace('label palace-8-寅', 'label top-3/4 -left-5');
                if(i===3) return html.replace('label palace-3-卯', 'label top-1/2 -left-5 -translate-y-1/2');
                if(i===4) return html.replace('label palace-4-辰', 'label bottom-3/4 -left-5').replace('label palace-4-巳', 'label -top-5 left-1/4');
                if(i===9) return html.replace('label palace-9-午', 'label -top-6 left-1/2 -translate-x-1/2');
                if(i===2) return html.replace('label palace-2-未', 'label -top-5 right-1/4').replace('label palace-2-申', 'label bottom-3/4 -right-5');
                if(i===7) return html.replace('label palace-7-酉', 'label top-1/2 -right-5 -translate-y-1/2');
                if(i===6) return html.replace('label palace-6-戌', 'label top-3/4 -right-5').replace('label palace-6-亥', 'label -bottom-5 right-1/4');
                return "";
            };

            for (let i = 1; i <= 9; i++) {
                const el = document.getElementById(`palace-${i}`);
                let wasActive = el.classList.contains('palace-active');
                el.className = `palace bg-${ACTIVE_PALACES[i].type}`;
                if (wasActive) el.classList.add('palace-active');

                let guaDisplay = ACTIVE_PALACES[i].gua;
                if (useNeiWai) {
                    let isInner = false;
                    if (isYang) {
                        if ([1, 8, 3, 4].includes(i)) isInner = true;
                    } else {
                        if ([9, 2, 7, 6].includes(i)) isInner = true;
                    }
                    guaDisplay = isInner ? "內" : "外";
                }

                const renderStem = (s, pNum, isAnGan = false) => {
                    let tags = []; if(isJiXing(s, pNum)) tags.push("刑"); if(isRuMu(s, pNum)) tags.push("墓");
                    let tagClass = isAnGan ? "text-gray-400" : "text-red-600";
                    let tagStr = tags.length ? `<span class="text-[10px] ${tagClass} ml-0.5 font-bold">(${tags.join("+")})</span>` : "";
                    
                    let displayChar = s;
                    if (useEnergy) {
                        let energyPNum = (pNum === 5) ? 2 : pNum; 
                        displayChar = STEM_ENERGY[s] ? STEM_ENERGY[s][energyPNum] : s;
                    }

                    if (isAnGan) {
                        let textClassSize = useEnergy ? "text-[10px] sm:text-xs" : "text-sm sm:text-base";
                        return `<span class="text-gray-400 ${textClassSize}">${displayChar}${tagStr}</span>`;
                    }

                    let stemColor = WUXING_COLORS[s] || "#1a202c";
                    let highlightClass = (s === targetHighlightStem) ? "hour-stem" : (s === dayHighlightStem ? "day-stem" : "");
                    let extraStyle = useEnergy && displayChar.length > 1 ? "font-size: 0.75em; line-height: 1;" : "";
                    let content = highlightClass ? `<span class="${highlightClass} font-bold" style="color: ${stemColor} !important; ${extraStyle}">${displayChar}</span>` : `<span class="font-bold" style="color: ${stemColor}; ${extraStyle}">${displayChar}</span>`;
                    return `<span>${content}${tagStr}</span>`;
                };

                if(i === 5) {
                    let s = earthPan[5], anGan = anGanPan[5];
                    el.innerHTML = `${getBranchHTML(5)}<div class="absolute top-0 right-0 text-[10px] text-gray-400 m-1">中五</div><div class="flex justify-center items-center h-full text-3xl text-black">${renderStem(s, 5)}</div><div class="absolute bottom-0 left-0 m-1">${renderStem(anGan, 5, true)}</div>`;
                    panData.palaces["中五"] = useEnergy ? (STEM_ENERGY[s] ? STEM_ENERGY[s][2] : s) : s; 
                    
                    globalPalaceData[5] = { name: ACTIVE_PALACES[5].name, hStems: [s], eStems: [s], anGan: anGan, isCenter: true };
                    continue;
                }
                
                let pDoor = doorPan[i], isKong = ACTIVE_PALACES[i].branch.includes(kw1) || ACTIVE_PALACES[i].branch.includes(kw2), isMa = ACTIVE_PALACES[i].branch.includes(ma);
                let hStems = Array.isArray(heavenPan[i]) ? heavenPan[i] : [heavenPan[i]];
                let eStems = Array.isArray(earthPan[i]) ? earthPan[i] : (i===2 ? [earthPan[2], earthPan[5]] : [earthPan[i]]);
                let pStars = Array.isArray(starPan[i]) ? starPan[i] : [starPan[i]];
                if(isMa) currentYiMaPalace = ACTIVE_PALACES[i].name;
                
                let godColor = GOD_COLORS[godPan[i]] || "black", doorColor = DOOR_COLORS[pDoor] || "black", anGan = anGanPan[i];
                let starText = (pStars[0] === "天芮" && pStars[1] === "天禽") ? "天芮/禽" : pStars[0];
                let palaceLabel = `${ACTIVE_PALACES[i].name}`;

                let pDoorDisplay = useEnergy ? DOOR_ENERGY[pDoor][i] : pDoor;
                let starTextDisplay = useEnergy ? (STAR_ENERGY[pStars[0]] ? STAR_ENERGY[pStars[0]][i] : starText) : starText;

                globalPalaceData[i] = {
                    name: ACTIVE_PALACES[i].name,
                    star: pStars[0],
                    door: pDoor,
                    god: godPan[i],
                    hStems: hStems,
                    eStems: eStems,
                    anGan: anGanPan[i],
                    isKong: isKong,
                    isMa: isMa,
                    isMenPo: isMenPo(pDoor, i),
                    hStemJiXing: hStems.filter(s => isJiXing(s, i)),
                    eStemJiXing: eStems.filter(s => isJiXing(s, (i===5)?2:i)),
                    hStemRuMu: hStems.filter(s => isRuMu(s, i)),
                    eStemRuMu: eStems.filter(s => isRuMu(s, (i===5)?2:i)),
                    isZhiShi: (pDoor === doorPan[currentD_val]),
                    palaceNum: i
                };

                // UI陣列複製並反轉，讓寄干呈現在最前面並以 "/" 分隔
                el.innerHTML = `${getBranchHTML(i)}
                    <div class="emoji-container">
                        ${isKong ? '<span>🈳</span>' : ''}
                        ${isMa ? '<span>🐎</span>' : ''}
                    </div>
                    <div class="flex flex-col h-full justify-between relative">
                        <div class="flex flex-col items-center leading-none mb-1 text-main">
                            <span class="text-palace-name text-${ACTIVE_PALACES[i].type}">${palaceLabel}</span>
                            <span class="text-xl leading-none mt-0.5">${guaDisplay}</span>
                        </div>
                        <div class="flex flex-col items-start leading-none mb-1">
                            <span class="text-main text-${godColor}">${godPan[i]}</span>
                        </div>
                        <div class="text-main leading-none mb-1 tracking-wider"><span class="text-${STAR_COLORS[pStars[0]] || 'black'}">${starTextDisplay}</span></div>
                        <div class="flex items-start leading-none mb-1"><span class="text-main text-${doorColor} tracking-wider">${pDoorDisplay}</span>${isMenPo(pDoor, i)?`<span class="text-[10px] text-red-600 mt-1 ml-0.5 font-bold">(迫)</span>`:""}</div>
                        <div class="flex justify-between items-end mt-auto">
                            <div class="mb-1">${renderStem(anGan, i, true)}</div>
                            <div class="flex flex-col items-end leading-tight text-main font-bold">
                                <div class="mb-1">${[...hStems].reverse().map(s => renderStem(s, i)).join('<span class="text-gray-400 mx-0.5">/</span>')}</div>
                                <div class="border-t-[1.5px] border-gray-300 min-w-[2.5rem] text-right pt-0.5">${[...eStems].reverse().map(s => renderStem(s, i)).join('<span class="text-gray-400 mx-0.5">/</span>')}</div>
                            </div>
                        </div>
                    </div>`;
                
                let doorTextForCopy = pDoorDisplay + (isMenPo(pDoor, i) ? "(迫)" : "");
                
                // 複製字串邏輯：依序讀取天盤/地盤陣列，索引0為本干加上(天)/(地)，若有索引1則為寄干加上(寄天)/(寄地)，並以「+」連接
                let hStemsForCopy = hStems.map((s, idx) => {
                    let txt = (useEnergy ? (STEM_ENERGY[s] ? STEM_ENERGY[s][i] : s) : s) + getStemTagsText(s, i);
                    return txt + (idx === 0 ? "(天)" : "(寄天)");
                }).join('+');

                let eStemsForCopy = eStems.map((s, idx) => {
                    let txt = (useEnergy ? (STEM_ENERGY[s] ? STEM_ENERGY[s][(i===5)?2:i] : s) : s) + getStemTagsText(s, i);
                    return txt + (idx === 0 ? "(地)" : "(寄地)");
                }).join('+');

                panData.palaces[ACTIVE_PALACES[i].name] = `${godPan[i]}/${starTextDisplay}/${doorTextForCopy}/${hStemsForCopy}/${eStemsForCopy}${isMa?'/**驛馬**':''}${isKong?'/**空亡**':''}`;
            }

            document.querySelectorAll('.palace').forEach(p => p.classList.remove('palace-active'));
            let hDayPalace = -1;
            for (let i = 1; i <= 9; i++) {
                if (i === 5) continue;
                let hStemsArray = Array.isArray(heavenPan[i]) ? heavenPan[i] : [heavenPan[i]];
                if (hStemsArray.includes(dayHighlightStem)) { 
                    hDayPalace = i;
                    break;
                }
            }
            if (hDayPalace !== -1) {
                document.getElementById(`palace-${hDayPalace}`).classList.add('palace-active');
            } else if (heavenPan[5] === dayHighlightStem || (Array.isArray(heavenPan[5]) && heavenPan[5].includes(dayHighlightStem))) { 
                document.getElementById('palace-5').classList.add('palace-active');
            }

        } catch (e) { alert("起盤錯誤: " + e.message); console.error(e); }
    }
    
    function copyPan() {
        const ACTIVE_PALACES = useXianTian ? PALACES_XIAN : PALACES_HOU;
        const baziLine = panData.bazi + (panData.special ? " " + panData.special : "") + (panData.stemStatus ? " " + panData.stemStatus : "");
        let text = `【奇門遁甲 - 拆補法排盤】\n時間：${baziLine}\n局數：${panData.ju}\n旬首：${panData.xun}\n值符：${panData.zf} | 值使：${panData.zs}\n空亡：${panData.kw} | 驛馬：${currentYiMaPalace}\n----------------------\n`;
        for (let i = 1; i <= 9; i++) {
            if(i!==5) {
                let pName = ACTIVE_PALACES[i].name;
                text += `${pName}：${panData.palaces[pName]}\n`;
            }
        }
        navigator.clipboard.writeText(text).then(() => alert("資料已複製！")).catch(() => { let t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("Copy"); t.remove(); alert("資料已複製！"); });
    }

    function sharePan() {
        const y = document.getElementById('sel-year').value;
        const m = document.getElementById('sel-month').value;
        const d = document.getElementById('sel-day').value;
        const h = document.getElementById('sel-hour24').value;
        const min = document.getElementById('sel-minute').value;
        
        const url = new URL(window.location.href);
        url.searchParams.set('y', y);
        url.searchParams.set('m', m);
        url.searchParams.set('d', d);
        url.searchParams.set('h', h);
        url.searchParams.set('min', min);
        
        navigator.clipboard.writeText(url.toString()).then(() => {
            alert("分享連結已複製！貼上即可分享目前的排盤時間。");
        }).catch(() => {
            let t = document.createElement("textarea"); 
            t.value = url.toString(); 
            document.body.appendChild(t); 
            t.select(); 
            document.execCommand("Copy"); 
            t.remove(); 
            alert("分享連結已複製！貼上即可分享目前的排盤時間。");
        });
    }

    window.onload = initSelectors;
</script>
</body>
</html>
