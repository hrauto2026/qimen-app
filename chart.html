<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇門遁甲 - 拆補法排盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
        body { 
            font-family: 'BiauKai', 'DFKai-SB', 'Kaiti', 'STKaiti', 'Noto Serif TC', serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            min-height: 100vh;
            font-weight: bold;
            color: #1a202c;
        }
        .grid-wrapper { padding: 30px 28px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        @media (max-width: 640px) {
            .grid-wrapper { padding: 20px 25px; }
            .grid-qimen { gap: 6px !important; margin: 0 auto; width: calc(100% - 10px); }
            .palace { min-height: 150px !important; padding: 6px !important; }
            .branch-label { font-size: 0.8rem !important; }
        }
        .grid-qimen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 550px; min-width: 300px; margin: auto; }
        .palace { 
            position: relative; border-radius: 10px; padding: 8px; min-height: 200px; 
            display: flex; flex-direction: column; box-shadow: 0 3px 10px rgba(0,0,0,0.08); 
            border: 1.5px solid; background-color: rgba(255, 255, 255, 0.85); 
            transition: all 0.2s; cursor: pointer;
        }
        .palace-active { border: 4px solid #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); z-index: 30; }

        .bg-water { background-color: #f0f9ff; border-color: #bae6fd; } .text-water { color: #0369a1; }
        .bg-brown { background-color: #fcf6f0; border-color: #d7c4b4; } .text-brown { color: #78350f; }
        .bg-wood { background-color: #f0fdf4; border-color: #bbf7d0; } .text-wood { color: #15803d; }
        .bg-fire { background-color: #fef2f2; border-color: #fecaca; } .text-fire { color: #b91c1c; }
        .bg-metal { background-color: #fffbeb; border-color: #fde68a; } .text-metal { color: #b45309; }
        .bg-white-palace { background-color: #ffffff; border-color: #e2e8f0; } 
        
        .text-main { font-size: clamp(0.95rem, 2.5vw, 1.45rem); line-height: 1.1; }
        .text-palace-name { font-weight: 900; }
        
        .day-stem { display: inline-block; background-color: #f3e8ff; border: 1.5px solid #a855f7; padding: 0 3px; border-radius: 4px; line-height: 1.1; }
        .hour-stem { display: inline-block; background-color: #ffedd5; border: 1.5px solid #f97316; padding: 0 3px; border-radius: 4px; line-height: 1.1; }
        
        .emoji-container { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 1.3rem; line-height: 1; z-index: 10; }
        .branch-label { position: absolute; color: #4b5563; font-size: 0.9rem; pointer-events: none; opacity: 0.9; z-index: 10; }
    </style>
</head>
<body class="p-2 md:p-8">

<div class="max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-4 md:p-8 border border-white">
    <h1 class="text-2xl md:text-4xl text-center mb-6 text-indigo-900 tracking-widest">
        (測試中)奇門遁甲 - 拆補法排盤 (<a href="https://hrauto2026.github.io/qimen-app/index.html" class="title-link hover:text-indigo-600 transition-colors duration-300">返回主頁</a>)
    </h1>
    
    <div class="flex flex-wrap justify-center items-center gap-2 mb-4 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 shadow-inner">
        <div class="flex items-center gap-1">
            <select id="sel-year" class="p-1 border border-gray-300 rounded bg-white text-base outline-none" onchange="updateJieQiYearBtn()"></select>
            <span class="text-gray-600 text-sm">年</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-month" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">月</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-day" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">日</span>
        </div>
        <div class="flex items-center gap-1">
            <select id="sel-hour" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">時</span>
        </div>
        <div class="w-full sm:w-auto flex justify-center gap-2 mt-2 sm:mt-0">
            <button onclick="resetToNow()" class="bg-blue-500 hover:bg-blue-600 text-white py-1.5 px-3 rounded-lg shadow text-sm">現在時間</button>
            <button onclick="generatePan()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 px-5 rounded-lg shadow text-sm">起盤</button>
            <button onclick="showJieQiModal()" class="bg-teal-600 hover:bg-teal-700 text-white py-1.5 px-3 rounded-lg shadow text-xs">🗓️ <span id="btn-jieqi-year"></span>年廿四節氣</button>
        </div>
    </div>

    <div id="pan-header" class="hidden mb-4 p-4 border-l-4 border-indigo-500 bg-indigo-50/80 rounded-r-lg text-gray-800 shadow-sm">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-2 gap-2">
            <h2 class="text-base sm:text-lg md:text-xl text-indigo-900 font-bold" id="info-bazi"></h2>
            <div class="flex space-x-2">
                <button onclick="shiftHour(-1)" class="flex-1 sm:flex-none bg-white border border-indigo-200 text-indigo-700 py-1.5 px-4 rounded shadow-sm text-xs sm:text-sm font-bold">◀ 前一時辰</button>
                <button onclick="shiftHour(1)" class="flex-1 sm:flex-none bg-white border border-indigo-200 text-indigo-700 py-1.5 px-4 rounded shadow-sm text-xs sm:text-sm font-bold">後一時辰 ▶</button>
            </div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1 sm:gap-2 text-sm sm:text-base md:text-lg leading-tight">
            <div><span class="text-gray-500">節氣：</span><span id="info-jieqi" class="text-indigo-800 font-bold"></span></div>
            <div><span class="text-gray-500">局數：</span><span id="info-ju" class="text-red-600 font-bold"></span></div>
            <div><span class="text-gray-500">旬首：</span><span id="info-xunshou"></span></div>
            <div><span class="text-gray-500">值符：</span><span id="info-zhifu"></span></div>
            <div><span class="text-gray-500">值使：</span><span id="info-zhishi"></span></div>
            <div><span class="text-gray-500">空亡：</span><span id="info-kongwang"></span></div>
        </div>
        <div id="info-special" class="hidden text-sm sm:text-base md:text-lg mt-1 border-t border-indigo-200 pt-1 font-bold"></div>
    </div>

    <div class="grid-wrapper">
        <div id="qimen-grid" class="grid-qimen hidden">
            <div id="palace-4" class="palace bg-wood" onclick="highlightPalace(this)"></div>
            <div id="palace-9" class="palace bg-fire" onclick="highlightPalace(this)"></div>
            <div id="palace-2" class="palace bg-brown" onclick="highlightPalace(this)"></div>
            <div id="palace-3" class="palace bg-wood" onclick="highlightPalace(this)"></div>
            <div id="palace-5" class="palace bg-white-palace" onclick="highlightPalace(this)"></div>
            <div id="palace-7" class="palace bg-metal" onclick="highlightPalace(this)"></div>
            <div id="palace-8" class="palace bg-brown" onclick="highlightPalace(this)"></div>
            <div id="palace-1" class="palace bg-water" onclick="highlightPalace(this)"></div>
            <div id="palace-6" class="palace bg-metal" onclick="highlightPalace(this)"></div>
        </div>
    </div>

    <div class="flex justify-center items-center mt-6 hidden gap-4 flex-wrap" id="action-footer">
        <button onclick="copyPan()" class="bg-slate-800 hover:bg-black text-white py-2.5 px-8 rounded-full shadow-lg transition active:scale-95 flex items-center justify-center text-base">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            複製盤面資料
        </button>
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow border border-indigo-100">
            <span class="text-sm font-bold text-gray-700" id="bagua-label">後天八卦數</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-bagua" class="sr-only peer" onchange="toggleBaGua()">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 shadow-inner"></div>
            </label>
        </div>
    </div>
</div>

<div id="jieqi-modal" class="fixed inset-0 bg-gray-900/60 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-5 max-w-md w-full max-h-[80vh] overflow-y-auto relative border-t-8 border-teal-600">
        <button onclick="closeJieQiModal()" class="absolute top-3 right-4 text-gray-400 hover:text-black text-2xl">✖</button>
        <h3 class="text-xl mb-4 text-center text-teal-800" id="jieqi-modal-title"></h3>
        <div id="jieqi-modal-content" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm"></div>
    </div>
</div>

<script>
    const STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    const BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const YI_LIU = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙']; 
    
    // 後天八卦方位
    const PALACES_HOU = {
        1: { name: "坎一", num: "一", gua: "☵", type: "water", branch: ["子"], baseDoor: "休門" },
        8: { name: "艮八", num: "八", gua: "☶", type: "brown", branch: ["丑", "寅"], baseDoor: "生門" },
        3: { name: "震三", num: "三", gua: "☳", type: "wood", branch: ["卯"], baseDoor: "傷門" },
        4: { name: "巽四", num: "四", gua: "☴", type: "wood", branch: ["辰", "巳"], baseDoor: "杜門" },
        9: { name: "離九", num: "九", gua: "☲", type: "fire", branch: ["午"], baseDoor: "景門" },
        2: { name: "坤二", num: "二", gua: "☷", type: "brown", branch: ["未", "申"], baseDoor: "死門" },
        7: { name: "兌七", num: "七", gua: "☱", type: "metal", branch: ["酉"], baseDoor: "驚門" },
        6: { name: "乾六", num: "六", gua: "☰", type: "metal", branch: ["戌", "亥"], baseDoor: "開門" },
        5: { name: "中五", num: "五", gua: "", type: "white-palace", branch: [], baseDoor: "死門" }
    };

    // 先天八卦方位
    const PALACES_XIAN = {
        1: { name: "坤八", num: "八", gua: "☷", type: "brown", branch: ["子"], baseDoor: "休門" },
        8: { name: "震四", num: "四", gua: "☳", type: "wood", branch: ["丑", "寅"], baseDoor: "生門" },
        3: { name: "離三", num: "三", gua: "☲", type: "fire", branch: ["卯"], baseDoor: "傷門" },
        4: { name: "兌二", num: "二", gua: "☱", type: "metal", branch: ["辰", "巳"], baseDoor: "杜門" },
        9: { name: "乾一", num: "一", gua: "☰", type: "metal", branch: ["午"], baseDoor: "景門" },
        2: { name: "巽五", num: "五", gua: "☴", type: "wood", branch: ["未", "申"], baseDoor: "死門" },
        7: { name: "坎六", num: "六", gua: "☵", type: "water", branch: ["酉"], baseDoor: "驚門" },
        6: { name: "艮七", num: "七", gua: "☶", type: "brown", branch: ["戌", "亥"], baseDoor: "開門" },
        5: { name: "中五", num: "五", gua: "", type: "white-palace", branch: [], baseDoor: "死門" }
    };

    const BRANCH_POSITIONS_TEMPLATE = { 1: `子`, 8: `丑寅`, 3: `卯`, 4: `辰巳`, 9: `午`, 2: `未申`, 7: `酉`, 6: `戌亥`, 5: `` };
    const STAR_COLORS = { "天蓬": "water", "天任": "brown", "天衝": "wood", "天輔": "wood", "天英": "fire", "天芮": "brown", "天柱": "metal", "天心": "metal", "天禽": "brown" };
    const GOD_COLORS = { "值符": "brown", "螣蛇": "fire", "太陰": "metal", "六合": "wood", "白虎": "metal", "玄武": "water", "九地": "brown", "九天": "metal" };
    const DOOR_COLORS = { "休門": "water", "生門": "brown", "傷門": "wood", "杜門": "wood", "景門": "fire", "死門": "brown", "驚門": "metal", "開門": "metal" };
    const BASE_STARS = { 1: "天蓬", 8: "天任", 3: "天衝", 4: "天輔", 9: "天英", 2: "天芮", 7: "天柱", 6: "天心", 5: "天禽" };
    const RING_ORDER = [1, 8, 3, 4, 9, 2, 7, 6];
    const GODS_YANG = ["值符", "螣蛇", "太陰", "六合", "白虎", "玄武", "九地", "九天"];
    const DOORS_ORDER = ["休門", "生門", "傷門", "杜門", "景門", "死門", "驚門", "開門"];
    const TRAD_JIEQI = { "冬至": "冬至", "小寒": "小寒", "大寒": "大寒", "立春": "立春", "雨水": "雨水", "惊蛰": "驚蟄", "驚蟄": "驚蟄", "春分": "春分", "清明": "清明", "谷雨": "穀雨", "穀雨": "穀雨", "立夏": "立夏", "小满": "小滿", "小滿": "小滿", "芒种": "芒種", "芒種": "芒種", "夏至": "夏至", "小暑": "小暑", "大暑": "大暑", "立秋": "立秋", "处暑": "處暑", "處暑": "處暑", "白露": "白露", "秋分": "秋分", "寒露": "寒露", "霜降": "霜降", "立冬": "立冬", "小雪": "小雪", "大雪": "大雪", "DONG_ZHI": "冬至" };
    const WUXING_COLORS = { '甲': '#15803d', '乙': '#15803d', '寅': '#15803d', '卯': '#15803d', '丙': '#b91c1c', '丁': '#b91c1c', '巳': '#b91c1c', '午': '#b91c1c', '戊': '#78350f', '己': '#78350f', '辰': '#78350f', '戌': '#78350f', '丑': '#78350f', '未': '#78350f', '庚': '#d97706', '辛': '#d97706', '申': '#d97706', '酉': '#d97706', '壬': '#0369a1', '癸': '#0369a1', '亥': '#0369a1', '子': '#0369a1' };
    const CLASH_MAP = { "子":"午", "午":"子", "丑":"未", "未":"丑", "寅":"申", "申":"寅", "卯":"酉", "酉":"卯", "辰":"戌", "戌":"辰", "巳":"亥", "亥":"巳" };

    let currentDate = new Date();
    let panData = {}; 
    let currentYiMaPalace = "";
    let useXianTian = false;

    function toggleBaGua() {
        useXianTian = document.getElementById('toggle-bagua').checked;
        document.getElementById('bagua-label').innerText = useXianTian ? "先天八卦數" : "後天八卦數";
        generatePan();
    }

    function initSelectors() {
        const ySel = document.getElementById('sel-year');
        const mSel = document.getElementById('sel-month');
        const dSel = document.getElementById('sel-day');
        const hSel = document.getElementById('sel-hour');
        for (let i = 1930; i <= 2050; i++) ySel.add(new Option(i, i));
        for (let i = 1; i <= 12; i++) mSel.add(new Option(i, i));
        for (let i = 1; i <= 31; i++) dSel.add(new Option(i, i));
        const hourOptions = [
            { label: "子 (23:00-00:59)", val: 23 }, { label: "丑 (01:00-02:59)", val: 1 }, { label: "寅 (03:00-04:59)", val: 3 },
            { label: "卯 (05:00-06:59)", val: 5 }, { label: "辰 (07:00-08:59)", val: 7 }, { label: "巳 (09:00-10:59)", val: 9 },
            { label: "午 (11:00-12:59)", val: 11 }, { label: "未 (13:00-14:59)", val: 13 }, { label: "申 (15:00-16:59)", val: 15 },
            { label: "酉 (17:00-18:59)", val: 17 }, { label: "戌 (19:00-20:59)", val: 19 }, { label: "亥 (21:00-22:59)", val: 21 }
        ];
        hourOptions.forEach(opt => hSel.add(new Option(opt.label, opt.val)));
        updateSelectorsFromDate(currentDate);
    }

    function updateSelectorsFromDate(d) {
        document.getElementById('sel-year').value = d.getFullYear();
        document.getElementById('sel-month').value = d.getMonth() + 1;
        document.getElementById('sel-day').value = d.getDate();
        let h = d.getHours();
        let hVal = (h >= 23 || h < 1) ? 23 : (h % 2 === 0 ? h - 1 : h);
        document.getElementById('sel-hour').value = hVal;
        updateJieQiYearBtn();
    }

    function updateJieQiYearBtn() { document.getElementById('btn-jieqi-year').innerText = document.getElementById('sel-year').value; }
    function resetToNow() { currentDate = new Date(); updateSelectorsFromDate(currentDate); generatePan(); }
    function shiftHour(dir) { currentDate.setHours(currentDate.getHours() + (dir * 2)); updateSelectorsFromDate(currentDate); generatePan(); }

    function highlightPalace(el) {
        document.querySelectorAll('.palace').forEach(p => p.classList.remove('palace-active'));
        el.classList.add('palace-active');
    }

    function showJieQiModal() {
        const y = parseInt(document.getElementById('sel-year').value);
        document.getElementById('jieqi-modal-title').innerText = `${y}年 廿四節氣`;
        let termsList = [];
        for(let m = 1; m <= 12; m++) {
            let d = Solar.fromYmd(y, m, 15).getLunar();
            let table = d.getJieQiTable(); 
            for(let key of Object.keys(table)) {
                let s = table[key];
                if(s.getYear() === y && s.getMonth() === m) termsList.push({ name: TRAD_JIEQI[key] || key, time: s.toYmdHms() });
            }
        }
        termsList.sort((a,b) => a.time.localeCompare(b.time));
        let html = '';
        termsList.forEach(t => { html += `<div class="p-2 border border-gray-100 rounded bg-gray-50 flex justify-between"><span class="text-teal-800">${t.name}</span><span class="text-gray-500 text-xs">${t.time.substring(5,16)}</span></div>`; });
        document.getElementById('jieqi-modal-content').innerHTML = html;
        document.getElementById('jieqi-modal').classList.remove('hidden');
    }
    function closeJieQiModal() { document.getElementById('jieqi-modal').classList.add('hidden'); }

    function getAccurateJieQi(lunarObj) {
        let jieQiName = "未知", timeStr = "";
        try {
            const prevJ = lunarObj.getPrevJie(true), prevQ = lunarObj.getPrevQi(true);
            if (prevJ && prevQ) {
                const jS = prevJ.getSolar(), qS = prevQ.getSolar();
                const dJ = new Date(jS.getYear(), jS.getMonth() - 1, jS.getDay(), jS.getHour(), jS.getMinute(), jS.getSecond());
                const dQ = new Date(qS.getYear(), qS.getMonth() - 1, qS.getDay(), qS.getHour(), qS.getMinute(), qS.getSecond());
                if (dJ > dQ) { jieQiName = TRAD_JIEQI[prevJ.getName()] || prevJ.getName(); timeStr = jS.toYmdHms(); }
                else { jieQiName = TRAD_JIEQI[prevQ.getName()] || prevQ.getName(); timeStr = qS.toYmdHms(); }
            }
        } catch (e) { console.error(e); }
        return { name: jieQiName, time: timeStr };
    }

    function colorizeGanZhi(str) {
        return str.split('').map(char => WUXING_COLORS[char] ? `<span style="color: ${WUXING_COLORS[char]}; text-shadow: 0 0 1px rgba(0,0,0,0.1);">${char}</span>` : char).join('');
    }

    function generatePan() {
        try {
            const ACTIVE_PALACES = useXianTian ? PALACES_XIAN : PALACES_HOU;
            const y = parseInt(document.getElementById('sel-year').value);
            const m = parseInt(document.getElementById('sel-month').value);
            const d = parseInt(document.getElementById('sel-day').value);
            
            // --- 日期合法性檢查 ---
            const checkDate = new Date(y, m - 1, d);
            if (checkDate.getFullYear() !== y || checkDate.getMonth() !== (m - 1) || checkDate.getDate() !== d) {
                alert(`錯誤：您輸入的日期 ${y}年${m}月${d}日 並不存在，請重新選擇。`);
                return;
            }
            // ---------------------

            const hSel = document.getElementById('sel-hour');
            const h = parseInt(hSel.value);
            currentDate = new Date(y, m - 1, d, h, 30); 
            const solar = Solar.fromYmdHms(y, m, d, h, 30, 0), lunar = solar.getLunar(), pureHour = hSel.options[hSel.selectedIndex].text.split(' ')[0]; 
            const baziRawStr = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhiExact()}日 ${lunar.getTimeInGanZhi()}時`;
