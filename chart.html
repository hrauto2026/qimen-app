<!DOCTYPE html>
<html lang="zh-TW">

            font-weight: bold;
            color: #1a202c;

            .branch-label { font-size: 0.8rem !important; }

        .grid-qimen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 550px; min-width: 300px; margin: auto; }
        .palace { position: relative; border-radius: 10px; padding: 8px; min-height: 180px; display: flex; flex-direction: column; box-shadow: 0 3px 10px rgba(0,0,0,0.08); border: 1.5px solid; background-color: rgba(255, 255, 255, 0.85); transition: transform 0.2s; }

        .bg-brown { background-color: #fcf6f0; border-color: #d7c4b4; } .text-brown { color: #78350f; }
        .bg-wood { background-color: #f0fdf4; border-color: #bbf7d0; } .text-wood { color: #15803d; }
        .bg-fire { background-color: #fef2f2; border-color: #fecaca; } .text-fire { color: #b91c1c; }
        .bg-metal { background-color: #fffbeb; border-color: #fde68a; } .text-metal { color: #b45309; }
        .bg-white-palace { background-color: #ffffff; border-color: #e2e8f0; } 
        .text-main { font-size: clamp(0.9rem, 2.5vw, 1.4rem); line-height: 1.1; }
        .hour-stem { display: inline-block; background-color: #f97316; color: white !important; padding: 0 3px; border-radius: 3px; line-height: 1.1; }
        .branch-label { position: absolute; color: #4b5563; font-size: 0.9rem; pointer-events: none; opacity: 0.9; z-index: 10; }
        .title-link:hover { text-decoration: underline; }
    </style>
</head>
<body class="p-2 md:p-8">

<div class="max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-4 md:p-8 border border-white">

            <span class="text-gray-600 text-sm">月</span>

        <div class="flex items-center gap-1">
            <select id="sel-day" class="p-1 border border-gray-300 rounded bg-white text-base outline-none"></select>
            <span class="text-gray-600 text-sm">日</span>

    <div id="pan-header" class="hidden mb-4 p-4 border-l-4 border-indigo-500 bg-indigo-50/80 rounded-r-lg text-gray-800 shadow-sm">

                <button onclick="shiftHour(1)" class="flex-1 sm:flex-none bg-white border border-indigo-200 text-indigo-700 py-1.5 px-4 rounded shadow-sm text-xs sm:text-sm font-bold">後一時辰 ▶</button>
            </div>

</div>

    let currentDate = new Date();
    let panData = {}; 
    let currentYiMaPalace = "";

    function initSelectors() {
        const ySel = document.getElementById('sel-year');
        const mSel = document.getElementById('sel-month');
        const dSel = document.getElementById('sel-day');
        const hSel = document.getElementById('sel-hour');
        for (let i = 1930; i <= 2050; i++) ySel.add(new Option(i, i));
        for (let i = 1; i <= 12; i++) mSel.add(new Option(i, i));
        for (let i = 1; i <= 31; i++) dSel.add(new Option(i, i));
        const hourOptions = [
            { label: "子 (23:00-00:59)", val: 23 }, { label: "丑 (01:00-02:59)", val: 1 }, { label: "寅 (03:00-04:59)", val: 3 },

        hourOptions.forEach(opt => hSel.add(new Option(opt.label, opt.val)));
        updateSelectorsFromDate(currentDate);
    }

    function updateSelectorsFromDate(d) {
        document.getElementById('sel-year').value = d.getFullYear();
        document.getElementById('sel-month').value = d.getMonth() + 1;
        document.getElementById('sel-day').value = d.getDate();
        let h = d.getHours();
        let hVal = (h >= 23 || h < 1) ? 23 : (h % 2 === 0 ? h - 1 : h);
        document.getElementById('sel-hour').value = hVal;
        updateJieQiYearBtn();
    }

    function updateJieQiYearBtn() { document.getElementById('btn-jieqi-year').innerText = document.getElementById('sel-year').value; }
    function resetToNow() { currentDate = new Date(); updateSelectorsFromDate(currentDate); generatePan(); }
    function shiftHour(dir) { currentDate.setHours(currentDate.getHours() + (dir * 2)); updateSelectorsFromDate(currentDate); generatePan(); }

    function showJieQiModal() {
        const y = parseInt(document.getElementById('sel-year').value);
        document.getElementById('jieqi-modal-title').innerText = `${y}年 廿四節氣`;
        let termsList = [];
        for(let m = 1; m <= 12; m++) {
            let d = Solar.fromYmd(y, m, 15).getLunar();
            let table = d.getJieQiTable(); 
            for(let key of Object.keys(table)) {
                let s = table[key];
                if(s.getYear() === y && s.getMonth() === m) termsList.push({ name: TRAD_JIEQI[key] || key, time: s.toYmdHms() });
            }
        }
        termsList.sort((a,b) => a.time.localeCompare(b.time));
        let html = '';
        termsList.forEach(t => { html += `<div class="p-2 border border-gray-100 rounded bg-gray-50 flex justify-between"><span class="text-teal-800">${t.name}</span><span class="text-gray-500 text-xs">${t.time.substring(5,16)}</span></div>`; });
        document.getElementById('jieqi-modal-content').innerHTML = html;
        document.getElementById('jieqi-modal').classList.remove('hidden');
    }
    function closeJieQiModal() { document.getElementById('jieqi-modal').classList.add('hidden'); }

    function getAccurateJieQi(lunarObj) {
        let jieQiName = "未知", timeStr = "";

            const prevJ = lunarObj.getPrevJie(true), prevQ = lunarObj.getPrevQi(true);
            if (prevJ && prevQ) {
                const jS = prevJ.getSolar(), qS = prevQ.getSolar();
                const dJ = new Date(jS.getYear(), jS.getMonth() - 1, jS.getDay(), jS.getHour(), jS.getMinute(), jS.getSecond());

                if (dJ > dQ) { jieQiName = TRAD_JIEQI[prevJ.getName()] || prevJ.getName(); timeStr = jS.toYmdHms(); }

        } catch (e) { console.error(e); }

    }

    function colorizeGanZhi(str) {
        return str.split('').map(char => WUXING_COLORS[char] ? `<span style="color: ${WUXING_COLORS[char]}; text-shadow: 0 0 1px rgba(0,0,0,0.1);">${char}</span>` : char).join('');
    }

    function generatePan() {
        try {
            const y = parseInt(document.getElementById('sel-year').value), m = parseInt(document.getElementById('sel-month').value), d = parseInt(document.getElementById('sel-day').value), hSel = document.getElementById('sel-hour'), h = parseInt(hSel.value);

            const solar = Solar.fromYmdHms(y, m, d, h, 30, 0), lunar = solar.getLunar(), pureHour = hSel.options[hSel.selectedIndex].text.split(' ')[0]; 
            const baziRawStr = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhiExact()}日 ${lunar.getTimeInGanZhi()}時`;

            const JU_TABLE = { "冬至": { 陽: true, 上元: 1, 中元: 7, 下元: 4 }, "小寒": { 陽: true, 上元: 2, 中元: 8, 下元: 5 }, "大寒": { 陽: true, 上元: 3, 中元: 9, 下元: 6 }, "立春": { 陽: true, 上元: 8, 中元: 5, 下元: 2 }, "雨水": { 陽: true, 上元: 9, 中元: 6, 下元: 3 }, "驚蟄": { 陽: true, 上元: 1, 中元: 7, 下元: 4 }, "春分": { 陽: true, 上元: 3, 中元: 9, 下元: 6 }, "清明": { 陽: true, 上元: 4, 中元: 1, 下元: 7 }, "穀雨": { 陽: true, 上元: 5, 中元: 2, 下元: 8 }, "立夏": { 陽: true, 上元: 4, 中元: 1, 下元: 7 }, "小滿": { 陽: true, 上元: 5, 中元: 2, 下元: 8 }, "芒種": { 陽: true, 上元: 6, 中元: 3, 下元: 9 }, "夏至": { 陽: false, 上元: 9, 中元: 3, 下元: 6 }, "小暑": { 陽: false, 上元: 8, 中元: 2, 下元: 5 }, "大暑": { 陽: false, 上元: 7, 中元: 1, 下元: 4 }, "立秋": { 陽: false, 上元: 2, 中元: 5, 下元: 8 }, "處暑": { 陽: false, 上元: 1, 中元: 4, 下元: 7 }, "白露": { 陽: false, 上元: 9, 中元: 3, 下元: 6 }, "秋分": { 陽: false, 上元: 7, 中元: 1, 下元: 4 }, "寒露": { 陽: false, 上元: 6, 中元: 9, 下元: 3 }, "霜降": { 陽: false, 上元: 5, 中元: 8, 下元: 2 }, "立冬": { 陽: false, 上元: 6, 中元: 9, 下元: 3 }, "小雪": { 陽: false, 上元: 5, 中元: 8, 下元: 2 }, "大雪": { 陽: false, 上元: 4, 中元: 7, 下元: 1 } };

            let heavenPan = {}, starPan = {}, targetPalace = parseInt(Object.keys(earthPan).find(k => earthPan[k] === (timeStem === '甲' ? xunShouStem : timeStem)));
            if(targetPalace === 5) targetPalace = 2;
            const rIdxTarget = RING_ORDER.indexOf(targetPalace), rIdxOrigin = RING_ORDER.indexOf(effectiveXunShouPalace), offset = (rIdxTarget - rIdxOrigin + 8) % 8;
            for (let i = 0; i < 8; i++) {
                const originP = RING_ORDER[i], targetP = RING_ORDER[(i + offset) % 8];
                starPan[targetP] = (originP === 2) ? [BASE_STARS[2], BASE_STARS[5]] : BASE_STARS[originP];
                heavenPan[targetP] = (originP === 2) ? [earthPan[2], earthPan[5]] : earthPan[originP];
            }
            let godPan = {}; for (let i = 0; i < 8; i++) godPan[RING_ORDER[(rIdxTarget + (isYang ? i : 8 - i)) % 8]] = GODS_YANG[i];
            let doorPan = {}, curD = xunShouPalace;
            for(let i=0; i<timeStemIdx; i++) { curD = isYang ? curD + 1 : curD - 1; if(curD > 9) curD = 1; else if(curD < 1) curD = 9; }
            if(curD === 5) curD = 2;
            const doorOriginIdx = RING_ORDER.indexOf(effectiveXunShouPalace), doorTargetIdx = RING_ORDER.indexOf(curD), doorOffset = (doorTargetIdx - doorOriginIdx + 8) % 8;
            for (let i = 0; i < 8; i++) doorPan[RING_ORDER[(i + doorOffset) % 8]] = DOORS_ORDER[i];
            
            // --- 修改 (1): 門地起盤法 暗干邏輯 ---
            let anGanPan = {};
            for (let i = 1; i <= 9; i++) {
                if(i === 5) { anGanPan[5] = earthPan[5]; continue; }
                let currentDoor = doorPan[i];
                // 找出該門的原始宮位
                let originPNum = Object.keys(PALACES).find(key => PALACES[key].baseDoor === currentDoor);
                anGanPan[i] = earthPan[originPNum];
            }

            const kwIdx = (xunShouIdx + 10) % 12, kw1 = BRANCHES[kwIdx], kw2 = BRANCHES[kwIdx+1], maMap = { "申": "寅", "子": "寅", "辰": "寅", "亥": "巳", "卯": "巳", "未": "巳", "寅": "申", "午": "申", "戌": "申", "巳": "亥", "酉": "亥", "丑": "亥" }, ma = maMap[timeBranch];
            let specialStr = "", isWuBuYu = (timeStemIdx === (STEMS.indexOf(dayStem) + 6) % 10), isTianXian = false;
            const dStemTX = dayGZ.substring(0, 1);
            if (((dStemTX === '甲' || dStemTX === '己') && (timeGZ === '己巳')) || ((dStemTX === '乙' || dStemTX === '庚') && timeGZ === '甲申') || ((dStemTX === '丙' || dStemTX === '辛') && timeGZ === '甲午') || ((dStemTX === '丁' || dStemTX === '壬') && timeGZ === '甲辰') || ((dStemTX === '戊' || dStemTX === '癸') && timeGZ === '甲寅')) isTianXian = true;
            if (isTianXian) specialStr += "<span class='text-green-600'>【✅天顯時格】</span> "; if (isWuBuYu) specialStr += "<span class='text-red-600'>【❌五不遇時】</span> ";
            document.getElementById('info-bazi').innerHTML = `${y}年${m}月${d}日${pureHour}時 ｜ ${coloredBaziStr}`;
            document.getElementById('info-jieqi').innerHTML = `${jieQi} <span class="text-[10px] text-gray-500 font-normal">(交節：${jqData.time})</span>`;
            document.getElementById('info-ju').innerText = juStr;
            document.getElementById('info-xunshou').innerText = xunShouGZ + xunShouStem;
            document.getElementById('info-zhifu').innerText = zhiFuStar;
            document.getElementById('info-zhishi').innerText = doorPan[curD];
            document.getElementById('info-kongwang').innerText = kw1 + "、" + kw2;
            document.getElementById('info-special').innerHTML = specialStr;
            document.getElementById('pan-header').classList.remove('hidden');
            document.getElementById('qimen-grid').classList.remove('hidden');
            document.getElementById('action-footer').classList.remove('hidden');

            const isMenPo = (door, pNum) => {
                const fire = pNum===9, water = pNum===1, earth = pNum===2||pNum===8, metal = pNum===6||pNum===7, wood = pNum===3||pNum===4;
                if (door==="休門" && fire) return true; if ((door==="生門"||door==="死門") && water) return true; if ((door==="傷門"||door==="杜門") && earth) return true; if (door==="景門" && metal) return true; if ((door==="驚門"||door==="開門") && wood) return true; return false;
            };
            const isJiXing = (stem, pNum) => (stem==='戊'&&pNum===3) || (stem==='己'&&pNum===2) || (stem==='庚'&&pNum===8) || (stem==='辛'&&pNum===9) || (stem==='壬'&&pNum===4) || (stem==='癸'&&pNum===4);
            const isRuMu = (stem, pNum) => (stem==='戊'&&pNum===6) || (stem==='丙'&&pNum===6) || (stem==='己'&&pNum===8) || (stem==='丁'&&pNum===8) || (stem==='庚'&&pNum===8) || (stem==='辛'&&pNum===4) || (stem==='壬'&&pNum===4) || (stem==='癸'&&pNum===2) || (stem==='乙'&&pNum===2);

            panData = { bazi: baziRawStr, ju: juStr, xun: xunShouGZ+xunShouStem, zf: zhiFuStar, zs: doorPan[curD], kw: kw1+"、"+kw2, palaces: {} };
            const currentMonthBranch = lunar.getMonthInGanZhi().substring(1, 2);
            const getBranchHTML = (i) => {
                let text = BRANCH_POSITIONS_TEMPLATE[i], html = "";
                for(let b of text) {
                    let wColor = WUXING_COLORS[b], style = `color: ${wColor}; font-weight: bold;`;
                    if(b === currentMonthBranch) html += `<div class="branch-label palace-${i}-${b} bg-yellow-200 px-1 rounded shadow border border-yellow-400 font-extrabold" style="${style}">${b}</div>`;
                    else html += `<div class="branch-label palace-${i}-${b}" style="${style}">${b}</div>`;
                }
                // 手動定位 
                if(i===1) return html.replace('label palace-1-子', 'label -bottom-6 left-1/2 -translate-x-1/2');
                if(i===8) return html.replace('label palace-8-丑', 'label -bottom-5 left-1/4').replace('label palace-8-寅', 'label top-3/4 -left-5');
                if(i===3) return html.replace('label palace-3-卯', 'label top-1/2 -left-5 -translate-y-1/2');
                if(i===4) return html.replace('label palace-4-辰', 'label bottom-3/4 -left-5').replace('label palace-4-巳', 'label -top-5 left-1/4');
                if(i===9) return html.replace('label palace-9-午', 'label -top-6 left-1/2 -translate-x-1/2');
                if(i===2) return html.replace('label palace-2-未', 'label -top-5 right-1/4').replace('label palace-2-申', 'label bottom-3/4 -right-5');
                if(i===7) return html.replace('label palace-7-酉', 'label top-1/2 -right-5 -translate-y-1/2');
                if(i===6) return html.replace('label palace-6-戌', 'label top-3/4 -right-5').replace('label palace-6-亥', 'label -bottom-5 right-1/4');
                return "";
            };

            for (let i = 1; i <= 9; i++) {
                const el = document.getElementById(`palace-${i}`);
                if(i === 5) {
                    let s = earthPan[5], anGan = anGanPan[5], tags = [];
                    if(isJiXing(anGan, 5)) tags.push("刑"); if(isRuMu(anGan, 5)) tags.push("墓");
                    el.innerHTML = `${getBranchHTML(5)}<div class="absolute top-0 right-0 text-[10px] text-gray-400 m-1">中五</div><div class="flex justify-center items-center h-full text-3xl text-black">${s === targetHighlightStem ? `<span class="hour-stem">${s}</span>` : s}</div><div class="absolute bottom-0 left-0 text-gray-400 text-lg m-1">${anGan}${tags.length?`<span class="text-[10px] font-normal">(${tags.join("+")})</span>`:""}</div>`;
                    panData.palaces["中五"] = s; continue;
                }
                let pDoor = doorPan[i], isKong = PALACES[i].branch.includes(kw1) || PALACES[i].branch.includes(kw2), isMa = PALACES[i].branch.includes(ma);
                let hStems = Array.isArray(heavenPan[i]) ? heavenPan[i] : [heavenPan[i]], eStems = Array.isArray(earthPan[i]) ? earthPan[i] : (i===2 ? [earthPan[2], earthPan[5]] : [earthPan[i]]);
                let pStars = Array.isArray(starPan[i]) ? starPan[i] : [starPan[i]];
                if(isMa) currentYiMaPalace = PALACES[i].name;
                const renderStem = (s, pNum) => {
                    let tags = []; if(isJiXing(s, pNum)) tags.push("刑"); if(isRuMu(s, pNum)) tags.push("墓");
                    return `<span>${s === targetHighlightStem ? `<span class="hour-stem font-bold">${s}</span>` : `<span class="text-black">${s}</span>`}${tags.length ? `<span class="text-[10px] text-gray-400 ml-0.5 font-bold">(${tags.join("+")})</span>` : ""}</span>`;
                };
                let godColor = GOD_COLORS[godPan[i]] || "black", doorColor = DOOR_COLORS[pDoor] || "black", anGan = anGanPan[i], anTags = [];
                if(isJiXing(anGan, i)) anTags.push("刑"); if(isRuMu(anGan, i)) anTags.push("墓");
                
                // --- 修改 (2): 天芮/禽 顯示 ---
                let starText = pStars[0];
                if(starText === "天芮" && pStars[1] === "天禽") starText = "天芮/禽";
                else if(starText === "天芮") starText = "天芮";

                el.innerHTML = `${getBranchHTML(i)}
                    <div class="flex flex-col h-full justify-between">
                        <div class="flex justify-between items-start leading-none mb-1"><span class="text-main text-${godColor}">${godPan[i]}</span><div class="flex flex-col items-end"><span class="text-[10px] text-${PALACES[i].type}">${PALACES[i].name}</span><span class="text-xs flex gap-1 mt-0.5">${isKong ? '🈳' : ''}${isMa ? '🐎' : ''}</span></div></div>
                        <div class="text-main leading-none mb-1 tracking-wider"><span class="text-${STAR_COLORS[pStars[0]] || 'black'}">${starText}</span></div>
                        <div class="flex items-start leading-none mb-1"><span class="text-main text-${doorColor} tracking-wider">${pDoor}</span>${isMenPo(pDoor, i)?`<span class="text-[10px] text-red-600 mt-1 ml-0.5 font-bold">(迫)</span>`:""}</div>
                        <div class="flex justify-between items-end mt-auto"><span class="text-gray-400 text-lg">${anGan}${anTags.length?`<span class="text-[10px] font-normal">(${anTags.join("+")})</span>`:""}</span><div class="flex flex-col items-end leading-tight text-main font-bold"><div class="mb-1">${hStems.map(s => renderStem(s, i)).join('<span class="text-gray-400 mx-0.5">/</span>')}</div><div class="border-t-[1.5px] border-gray-300 min-w-[2.5rem] text-right pt-0.5">${eStems.map(s => renderStem(s, i)).join('<span class="text-gray-400 mx-0.5">/</span>')}</div></div></div>
                    </div>`;
                panData.palaces[PALACES[i].name] = `${godPan[i]}/${starText}/${pDoor}/${hStems.join('+')}(天)/${eStems.join('+')}(地)${isMa?'/馬':''}${isKong?'/空':''}`;
            }
        } catch (e) { alert("起盤錯誤: " + e.message); console.error(e); }
    }
    function copyPan() {
        const specialText = document.getElementById('info-special').innerText.trim(), baziLine = panData.bazi + (specialText ? " " + specialText : "");
        let text = `【奇門遁甲 - 拆補法排盤】\n時間：${baziLine}\n局數：${panData.ju}\n旬首：${panData.xun}\n值符：${panData.zf} | 值使：${panData.zs}\n空亡：${panData.kw} | 驛馬：${currentYiMaPalace}\n----------------------\n`;
        for (let i = 1; i <= 9; i++) if(i!==5) text += `${PALACES[i].name}：${panData.palaces[PALACES[i].name]}\n`;
        navigator.clipboard.writeText(text).then(() => alert("資料已複製！")).catch(() => { let t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("Copy"); t.remove(); alert("資料已複製！"); });
    }
    window.onload = initSelectors;
</script>
</body>
</html>
