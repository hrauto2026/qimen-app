<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>屋向奇門排盤 - 三元九運四十八局</title>
    
    <!-- iOS Home Screen Icon & Desktop Favicon -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            font-family: 'BiauKai', 'DFKai-SB', 'Kaiti', 'STKaiti', 'Noto Serif TC', serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            min-height: 100vh;
            font-weight: bold;
            color: #1a202c;
        }

        .grid-wrapper { 
            padding: 8px 12px; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        .grid-qimen { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            max-width: 680px; 
            min-width: 320px; 
            margin: 0 auto; 
        }
        
        .palace { 
            position: relative; 
            border-radius: 10px; 
            padding: 8px 10px; 
            min-height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
            border: 1.5px solid; 
            background-color: rgba(255, 255, 255, 0.97); 
            transition: all 0.2s ease; 
        }

        @media (max-width: 640px) {
            .grid-wrapper { padding: 4px 6px !important; }
            .grid-qimen { gap: 6px !important; }
            .palace { 
                min-height: 168px !important; 
                padding: 6px 7px !important; 
            }
        }

        /* 古典五行配色 */
        .bg-water { background-color: #f0f9ff; border-color: #bae6fd; } .text-water { color: #0369a1; }
        .bg-brown { background-color: #fcf6f0; border-color: #d7c4b4; } .text-brown { color: #78350f; }
        .bg-wood { background-color: #f0fdf4; border-color: #bbf7d0; } .text-wood { color: #15803d; }
        .bg-fire { background-color: #fef2f2; border-color: #fecaca; } .text-fire { color: #b91c1c; }
        .bg-metal { background-color: #fffbeb; border-color: #fde68a; } .text-metal { color: #b45309; }
        .bg-white-palace { background-color: #ffffff; border-color: #cbd5e1; } 
        
        /* 放大字級設計 */
        .text-main { 
            font-size: clamp(1.5rem, 4.8vw, 1.95rem); 
            font-weight: 900;
            letter-spacing: 0.04em;
            line-height: 1.12; 
        }
        .text-palace-name { 
            font-size: clamp(0.95rem, 2.7vw, 1.18rem); 
            font-weight: 900; 
        }
        .text-tiandi-stem {
            font-size: clamp(1.35rem, 4.5vw, 1.8rem);
            font-weight: 900;
            line-height: 1.05;
        }

        select {
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-2 sm:p-4 md:p-6">

<div class="max-w-4xl mx-auto space-y-3 sm:space-y-4">
    
    <!-- 主排盤卡片 -->
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-3 sm:p-5 md:p-6 border border-white">
        
        <!-- 頂部標題 -->
        <div class="text-center mb-3 sm:mb-4 border-b border-indigo-100 pb-2.5">
            <h1 class="text-xl sm:text-2xl md:text-3xl text-indigo-950 font-black tracking-widest flex items-center justify-center gap-2">
                <span>屋向奇門排盤</span>
                <span class="text-xs sm:text-sm bg-indigo-100 text-indigo-800 px-2.5 py-0.5 rounded-full font-bold">三元九運四十八局</span>
            </h1>
        </div>

        <!-- 條件設定下拉選單區 -->
        <div class="bg-indigo-50/70 border border-indigo-200 rounded-xl p-2.5 sm:p-3 mb-3 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3 items-center">
                
                <!-- (i) 運別選單 -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs sm:text-sm font-black text-indigo-900 flex items-center gap-1">
                        <span>⏳ (一) 選擇元運</span>
                    </label>
                    <select id="sel-yun" onchange="calculateAndRender()" class="w-full p-2 border border-indigo-300 rounded-lg bg-white text-sm font-bold text-indigo-950 outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <option value="1">上元 一運 (坎一)</option>
                        <option value="2">上元 二運 (坤二)</option>
                        <option value="3">上元 三運 (震三)</option>
                        <option value="4">中元 四運 (巽四)</option>
                        <option value="5">中元 五運 (中五)</option>
                        <option value="6">中元 六運 (乾六)</option>
                        <option value="7">下元 七運 (兌七)</option>
                        <option value="8">下元 八運 (艮八)</option>
                        <option value="9" selected>下元 九運 (離九)</option>
                    </select>
                </div>

                <!-- (ii) 屋向選單 -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs sm:text-sm font-black text-indigo-900 flex items-center gap-1">
                        <span>🏠 (二) 選擇屋向 (坐向)</span>
                    </label>
                    <select id="sel-house" onchange="calculateAndRender()" class="w-full p-2 border border-indigo-300 rounded-lg bg-white text-sm font-bold text-indigo-950 outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <option value="1" selected>屋向坎 · 正北 (壬 / 子 / 癸)</option>
                        <option value="8">屋向艮 · 東北 (丑 / 艮 / 寅)</option>
                        <option value="3">屋向震 · 正東 (甲 / 卯 / 乙)</option>
                        <option value="4">屋向巽 · 東南 (辰 / 巽 / 巳)</option>
                        <option value="9">屋向離 · 正南 (丙 / 午 / 丁)</option>
                        <option value="2">屋向坤 · 西南 (未 / 坤 / 申)</option>
                        <option value="7">屋向兌 · 正西 (庚 / 酉 / 辛)</option>
                        <option value="6">屋向乾 · 西北 (戌 / 乾 / 亥)</option>
                    </select>
                </div>

                <!-- (iii) 門向選單 -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs sm:text-sm font-black text-indigo-900 flex items-center gap-1">
                        <span>🚪 (三) 選擇門向 (納氣方)</span>
                    </label>
                    <select id="sel-door" onchange="calculateAndRender()" class="w-full p-2 border border-indigo-300 rounded-lg bg-white text-sm font-bold text-indigo-950 outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                        <optgroup label="坎宮 (正北)">
                            <option value="子" selected>門向子 (坎宮中山)</option>
                            <option value="丑">門向丑 (艮宮前山 · 屬子丑組)</option>
                            <option value="壬">門向壬 (坎宮前山)</option>
                            <option value="癸">門向癸 (坎宮後山)</option>
                        </optgroup>
                        <optgroup label="艮宮 (東北)">
                            <option value="艮">門向艮 (艮宮中山)</option>
                            <option value="寅">門向寅 (艮宮後山 · 屬寅亥組)</option>
                        </optgroup>
                        <optgroup label="震宮 (正東)">
                            <option value="卯">門向卯 (震宮中山 · 屬卯戌組)</option>
                            <option value="甲">門向甲 (震宮前山)</option>
                            <option value="乙">門向乙 (震宮後山)</option>
                        </optgroup>
                        <optgroup label="巽宮 (東南)">
                            <option value="辰">門向辰 (巽宮前山 · 屬辰酉組)</option>
                            <option value="巽">門向巽 (巽宮中山)</option>
                            <option value="巳">門向巳 (巽宮後山 · 屬巳申組)</option>
                        </optgroup>
                        <optgroup label="離宮 (正南)">
                            <option value="午">門向午 (離宮中山 · 屬午未組)</option>
                            <option value="丙">門向丙 (離宮前山)</option>
                            <option value="丁">門向丁 (離宮後山)</option>
                        </optgroup>
                        <optgroup label="坤宮 (西南)">
                            <option value="未">門向未 (坤宮前山 · 屬午未組)</option>
                            <option value="坤">門向坤 (坤宮中山)</option>
                            <option value="申">門向申 (坤宮後山 · 屬巳申組)</option>
                        </optgroup>
                        <optgroup label="兌宮 (正西)">
                            <option value="酉">門向酉 (兌宮中山 · 屬辰酉組)</option>
                            <option value="庚">門向庚 (兌宮前山)</option>
                            <option value="辛">門向辛 (兌宮後山)</option>
                        </optgroup>
                        <optgroup label="乾宮 (西北)">
                            <option value="戌">門向戌 (乾宮前山 · 屬卯戌組)</option>
                            <option value="乾">門向乾 (乾宮中山)</option>
                            <option value="亥">門向亥 (乾宮後山 · 屬寅亥組)</option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>

        <!-- 盤面資訊 Bar (加大字體) -->
        <div id="pan-summary-bar" class="bg-indigo-50/90 border-l-4 border-indigo-600 rounded-r-lg py-2.5 px-3 sm:px-4 mb-3 flex flex-wrap justify-between items-center text-sm sm:text-base md:text-lg font-bold text-indigo-950 gap-2 sm:gap-4">
            <div><span class="text-gray-500 font-bold">格局：</span><span id="summary-title" class="text-red-600 font-black"></span></div>
            <div><span class="text-gray-500 font-bold">符頭干：</span><span id="summary-futou" class="text-indigo-900 font-black"></span></div>
            <div><span class="text-gray-500 font-bold">屋向加臨：</span><span id="summary-zhifu" class="text-indigo-900 font-black"></span></div>
        </div>

        <!-- 奇門九宮格主畫面 -->
        <div class="grid-wrapper">
            <div id="qimen-grid" class="grid-qimen">
                <!-- Row 1: 巽四, 離九, 坤二 -->
                <div id="palace-4" class="palace bg-wood"></div>
                <div id="palace-9" class="palace bg-fire"></div>
                <div id="palace-2" class="palace bg-brown"></div>

                <!-- Row 2: 震三, 中五, 兌七 -->
                <div id="palace-3" class="palace bg-wood"></div>
                <div id="palace-5" class="palace bg-white-palace"></div>
                <div id="palace-7" class="palace bg-metal"></div>

                <!-- Row 3: 艮八, 坎一, 乾六 -->
                <div id="palace-8" class="palace bg-brown"></div>
                <div id="palace-1" class="palace bg-water"></div>
                <div id="palace-6" class="palace bg-metal"></div>
            </div>
        </div>

        <!-- 底部按鈕區 -->
        <div class="flex flex-col items-center justify-center mt-4 space-y-2.5">
            <div class="flex justify-center items-center gap-2.5 flex-wrap">
                <button onclick="copyPanText()" class="bg-slate-800 hover:bg-black text-white font-bold py-2 px-4 sm:px-5 rounded-full shadow-md transition active:scale-95 text-xs sm:text-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    複製盤面資料
                </button>
                <button onclick="sharePanUrl()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 sm:px-5 rounded-full shadow-md transition active:scale-95 text-xs sm:text-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    分享此盤連結
                </button>
            </div>
            <div class="text-xs text-gray-400 font-bold tracking-wider pt-1">
                RS2026 (V. 1)
            </div>
        </div>

    </div>
</div>

<script>
    const PALACES = {
        1: { name: "坎一", gua: "☵", dir: "正北", type: "water", baseStar: "天蓬" },
        8: { name: "艮八", gua: "☶", dir: "東北", type: "brown", baseStar: "天任" },
        3: { name: "震三", gua: "☳", dir: "正東", type: "wood", baseStar: "天沖" },
        4: { name: "巽四", gua: "☴", dir: "東南", type: "wood", baseStar: "天輔" },
        9: { name: "離九", gua: "☲", dir: "正南", type: "fire", baseStar: "天英" },
        2: { name: "坤二", gua: "☷", dir: "西南", type: "brown", baseStar: "天芮" },
        7: { name: "兌七", gua: "☱", dir: "正西", type: "metal", baseStar: "天柱" },
        6: { name: "乾六", gua: "☰", dir: "西北", type: "metal", baseStar: "天心" },
        5: { name: "中五", gua: "",   dir: "中宮", type: "white-palace", baseStar: "天禽" }
    };

    const WUXING_COLORS = { 
        '甲': '#15803d', '乙': '#15803d', 
        '丙': '#b91c1c', '丁': '#b91c1c', 
        '戊': '#78350f', '己': '#78350f', 
        '庚': '#d97706', '辛': '#d97706', 
        '壬': '#0369a1', '癸': '#0369a1' 
    };

    const STAR_COLORS = { 
        "天蓬": "text-sky-700", "天任": "text-amber-900", "天沖": "text-emerald-700", 
        "天輔": "text-emerald-700", "天英": "text-red-700", "天芮": "text-amber-900", 
        "天禽": "text-amber-900", "天柱": "text-amber-600", "天心": "text-amber-600" 
    };

    const GOD_COLORS = { 
        "值符": "text-emerald-700", "螣蛇": "text-red-700", "太陰": "text-amber-600", 
        "六合": "text-emerald-700", "白虎": "text-amber-600", "玄武": "text-sky-700", 
        "九地": "text-amber-900", "九天": "text-amber-600" 
    };

    const DOOR_COLORS = { 
        "休門": "text-sky-700", "生門": "text-amber-900", "傷門": "text-emerald-700", 
        "杜門": "text-emerald-700", "景門": "text-red-700", "死門": "text-amber-900", 
        "驚門": "text-amber-600", "開門": "text-amber-600" 
    };

    const CHINESE_NUMS = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const YUN_NAMES = ['', '上元一運', '上元二運', '上元三運', '中元四運', '中元五運', '中元六運', '下元七運', '下元八運', '下元九運'];

    const LUOSHU_FLY_PALACES = [5, 6, 7, 8, 9, 1, 2, 3, 4];
    const STEMS_9 = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];

    const RING_PALACES = [1, 8, 3, 4, 9, 2, 7, 6];
    const STAR_RING = ['天蓬', '天任', '天沖', '天輔', '天英', '天芮', '天柱', '天心'];
    const STAR_BASE_PALACE = { '天蓬':1, '天任':8, '天沖':3, '天輔':4, '天英':9, '天芮':2, '天柱':7, '天心':6, '天禽':2 };

    const GODS_RING = ["值符", "螣蛇", "太陰", "六合", "白虎", "玄武", "九地", "九天"];
    const DOORS_RING = ["休門", "生門", "傷門", "杜門", "景門", "死門", "驚門", "開門"];

    const MOUNTAIN_TO_FUTOU_STEM = {
        '子': '戊', '丑': '戊', '壬': '戊', '癸': '戊',
        '卯': '己', '戌': '己', '甲': '己', '乙': '己',
        '巳': '庚', '申': '庚', '巽': '庚', '坤': '庚',
        '午': '辛', '未': '辛', '丙': '辛', '丁': '辛',
        '辰': '壬', '酉': '壬', '庚': '壬', '辛': '壬',
        '寅': '癸', '亥': '癸', '艮': '癸', '乾': '癸'
    };

    const MOUNTAIN_PALACE = {
        '壬':1, '子':1, '癸':1,
        '丑':8, '艮':8, '寅':8,
        '甲':3, '卯':3, '乙':3,
        '辰':4, '巽':4, '巳':4,
        '丙':9, '午':9, '丁':9,
        '未':2, '坤':2, '申':2,
        '庚':7, '酉':7, '辛':7,
        '戌':6, '乾':6, '亥':6
    };

    const DOOR_XIU_PALACE_MAP = {
        '子': 1, '丑': 9, '寅': 3, '卯': 8, '辰': 6, '巳': 4,
        '午': 9, '未': 3, '申': 9, '酉': 9, '戌': 4, '亥': 9,
        '壬': 1, '癸': 1, '艮': 3, '甲': 8, '乙': 8, '巽': 4,
        '丙': 9, '丁': 9, '坤': 3, '庚': 9, '辛': 9, '乾': 9
    };

    let currentPanData = {};

    function colorizeStem(s) {
        if (!s) return '';
        return s.split('').map(char => {
            const color = WUXING_COLORS[char] || '#1a202c';
            return `<span style="color: ${color};">${char}</span>`;
        }).join('');
    }

    function calculateAndRender() {
        const yun = parseInt(document.getElementById('sel-yun').value);
        const housePalace = parseInt(document.getElementById('sel-house').value);
        const doorMountain = document.getElementById('sel-door').value;

        // 1. 排地盤數與地盤干
        const earthNum = {};
        const earthStem = {};

        for (let i = 0; i < 9; i++) {
            const p = LUOSHU_FLY_PALACES[i];
            const num = ((yun - 1 + i) % 9) + 1;
            earthNum[p] = num;
        }

        const yunPalaceIndexInFly = LUOSHU_FLY_PALACES.indexOf(yun);
        for (let k = 0; k < 9; k++) {
            const p = LUOSHU_FLY_PALACES[(yunPalaceIndexInFly + k) % 9];
            earthStem[p] = STEMS_9[k];
        }

        // 中五宮地盤干寄坤二宮
        const centerStem = earthStem[5];
        const rawKunStem = earthStem[2];
        earthStem[2] = rawKunStem + centerStem;

        // 2. 查門向符頭干
        const fuTouStem = MOUNTAIN_TO_FUTOU_STEM[doorMountain] || '戊';

        // 3. 查符頭干在地盤宮位以定值符星
        let originPalace = 5;
        if (fuTouStem === centerStem) {
            originPalace = 2;
        } else {
            for (let p of RING_PALACES) {
                if (earthStem[p].includes(fuTouStem)) {
                    originPalace = p;
                    break;
                }
            }
        }

        const leaderStar = PALACES[originPalace].baseStar;
        const starLeader = (leaderStar === '天禽') ? '天芮' : leaderStar;

        // 4. 天盤九星與天盤干旋轉
        const starPan = {};
        const heavenStemPan = {};

        const starOriginIdx = STAR_RING.indexOf(starLeader);
        const houseRingIdx = RING_PALACES.indexOf(housePalace);

        for (let k = 0; k < 8; k++) {
            const targetP = RING_PALACES[(houseRingIdx + k) % 8];
            const currStar = STAR_RING[(starOriginIdx + k) % 8];
            starPan[targetP] = currStar;

            const baseP = STAR_BASE_PALACE[currStar];
            heavenStemPan[targetP] = earthStem[baseP];
        }

        // 5. 八神旋轉
        const godPan = {};
        for (let k = 0; k < 8; k++) {
            const targetP = RING_PALACES[(houseRingIdx + k) % 8];
            godPan[targetP] = GODS_RING[k];
        }

        // 6. 八門旋轉
        const doorPan = {};
        const doorPalaceOfMountain = MOUNTAIN_PALACE[doorMountain];
        
        let xiuPalace = DOOR_XIU_PALACE_MAP[doorMountain] || 1;
        if (housePalace === doorPalaceOfMountain && (doorMountain === '子' || doorMountain === '午')) {
            xiuPalace = housePalace;
        }

        const xiuRingIdx = RING_PALACES.indexOf(xiuPalace);
        for (let k = 0; k < 8; k++) {
            const targetP = RING_PALACES[(xiuRingIdx + k) % 8];
            doorPan[targetP] = DOORS_RING[k];
        }

        // 7. 更新摘要 Bar
        const yunName = YUN_NAMES[yun];
        const houseName = PALACES[housePalace].name + ' ' + PALACES[housePalace].dir;
        const doorName = `門向${doorMountain}`;
        const zhiFuText = `${starLeader} (帶 ${heavenStemPan[housePalace]})`;

        document.getElementById('summary-title').innerText = `${yunName} · ${doorName} · ${PALACES[housePalace].name}向`;
        document.getElementById('summary-futou').innerText = `${fuTouStem} (地盤${PALACES[originPalace].name})`;
        document.getElementById('summary-zhifu').innerText = zhiFuText;

        currentPanData = {
            yun: yunName,
            house: houseName,
            door: doorName,
            fuTou: fuTouStem,
            leaderStar: zhiFuText,
            palaces: {}
        };

        // 8. 渲染各宮
        for (let p = 1; p <= 9; p++) {
            const el = document.getElementById(`palace-${p}`);
            const pInfo = PALACES[p];
            el.className = `palace bg-${pInfo.type}`;

            if (p === 5) {
                const eNumZh = CHINESE_NUMS[earthNum[5]];
                const eStem = centerStem;
                el.innerHTML = `
                    <div class="flex justify-between items-center w-full border-b border-gray-200 pb-1">
                        <span class="text-palace-name text-brown font-black">中五宮</span>
                        <span class="text-xs bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded font-black">立極</span>
                    </div>
                    
                    <div class="flex flex-col items-center justify-center my-auto py-2 leading-relaxed text-center select-none space-y-1">
                        <div class="text-base sm:text-lg text-indigo-950 font-black tracking-wide">${yunName}</div>
                        <div class="text-xs sm:text-sm text-gray-700 font-black">屋向: <span class="text-indigo-900">${PALACES[housePalace].name} (${PALACES[housePalace].dir})</span></div>
                        <div class="text-xs sm:text-sm text-gray-700 font-black">門向: <span class="text-blue-900">${doorMountain}向</span></div>
                    </div>

                    <div class="flex justify-between items-end w-full pt-1.5 border-t border-gray-200">
                        <span class="text-xl sm:text-2xl font-black text-black leading-none">${eNumZh}</span>
                        <div class="text-tiandi-stem text-right leading-none">${colorizeStem(eStem)}</div>
                    </div>`;
                
                currentPanData.palaces[pInfo.name] = `中宮 [數:${eNumZh} 干:${eStem}]`;
                continue;
            }

            const isHouseFacing = (p === housePalace);
            const isDoorFacing = (p === doorPalaceOfMountain);

            // 屋向與門向標籤（放置在地數後邊）
            let badges = '';
            if (isHouseFacing) badges += `<span class="bg-red-600 text-white text-[11px] sm:text-xs px-1.5 py-0.5 rounded shadow-sm font-black whitespace-nowrap">屋向</span>`;
            if (isDoorFacing) badges += `<span class="bg-blue-600 text-white text-[11px] sm:text-xs px-1.5 py-0.5 rounded shadow-sm font-black whitespace-nowrap">門向</span>`;

            const god = godPan[p];
            const star = starPan[p];
            const door = doorPan[p];
            const hStem = heavenStemPan[p];
            const eStem = earthStem[p];
            const eNumZh = CHINESE_NUMS[earthNum[p]];

            const godCol = GOD_COLORS[god] || 'text-gray-900';
            const starCol = STAR_COLORS[star] || 'text-gray-900';
            const doorCol = DOOR_COLORS[door] || 'text-gray-900';

            el.innerHTML = `
                <div class="flex justify-between items-center w-full border-b border-gray-200/90 pb-1">
                    <span class="text-palace-name text-${pInfo.type} font-black whitespace-nowrap">
                        ${pInfo.name} ${pInfo.gua} <span class="text-xs sm:text-sm font-black text-gray-700 ml-0.5">(${pInfo.dir})</span>
                    </span>
                </div>

                <div class="flex flex-col items-start leading-none space-y-1.5 w-full my-auto py-1">
                    <span class="text-main ${godCol}">${god}</span>
                    <span class="text-main ${starCol}">${star}</span>
                    <span class="text-main ${doorCol}">${door}</span>
                </div>

                <div class="flex justify-between items-end w-full pt-1.5 border-t border-gray-200/90">
                    <div class="flex items-center gap-1.5">
                        <span class="text-xl sm:text-2xl font-black text-black leading-none">${eNumZh}</span>
                        ${badges}
                    </div>
                    <div class="flex flex-col items-end leading-tight text-right text-tiandi-stem font-black">
                        <div>${colorizeStem(hStem)}</div>
                        <div class="border-t-[2.5px] border-gray-500 min-w-[2.4rem] pt-0.5 mt-0.5">${colorizeStem(eStem)}</div>
                    </div>
                </div>`;

            currentPanData.palaces[pInfo.name] = `${god} / ${star} / ${door} / 天[${hStem}] 地[${eStem}] 數[${eNumZh}]${isHouseFacing?' (屋向)':''}${isDoorFacing?' (門向)':''}`;
        }
    }

    function copyPanText() {
        let text = `【屋向奇門排盤 - ${currentPanData.yun}】\n`;
        text += `屋向：${currentPanData.house} ｜ 門向：${currentPanData.door}\n`;
        text += `值符加臨：${currentPanData.leaderStar} ｜ 符頭干：${currentPanData.fuTou}\n`;
        text += `--------------------------------------\n`;

        const order = [4, 9, 2, 3, 5, 7, 8, 1, 6];
        order.forEach(p => {
            const pName = PALACES[p].name;
            text += `${pName} (${PALACES[p].dir})：${currentPanData.palaces[pName]}\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            alert("📋 屋向奇門盤面資料已成功複製至剪貼簿！");
        }).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
            alert("📋 屋向奇門盤面資料已成功複製至剪貼簿！");
        });
    }

    function sharePanUrl() {
        const yun = document.getElementById('sel-yun').value;
        const house = document.getElementById('sel-house').value;
        const door = document.getElementById('sel-door').value;

        const url = new URL(window.location.origin + window.location.pathname);
        url.searchParams.set('yun', yun);
        url.searchParams.set('house', house);
        url.searchParams.set('door', door);

        navigator.clipboard.writeText(url.toString()).then(() => {
            alert("🔗 已複製專屬盤局網址至剪貼簿！\n好友開啟該連結即可直接查閱此排盤。");
        }).catch(() => {
            const ta = document.createElement("textarea");
            ta.value = url.toString();
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
            alert("🔗 已複製專屬盤局網址至剪貼簿！");
        });
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('yun')) {
            document.getElementById('sel-yun').value = params.get('yun');
        }
        if (params.has('house')) {
            document.getElementById('sel-house').value = params.get('house');
        }
        if (params.has('door')) {
            document.getElementById('sel-door').value = params.get('door');
        }
        calculateAndRender();
    };
</script>
</body>
</html>
